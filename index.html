  const wkAgo = fmtInput(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7));
  const forgotOut = records.filter(r => r.date < todayStr && r.date >= wkAgo && !r.timeOut && inDept(r.empId)).length;
  const swapCells = new Set();
  const swapDone = new Set();   // ช่องที่เปลี่ยนจากคำขอที่อนุมัติแล้ว (จุดเขียว)
  const cellsOf = s => [[s.empId, s.dateA], [s.empId, s.dateB], ...(s.friendId ? [[s.friendId, s.dateA], [s.friendId, s.dateB]] : [])];
  swaps.forEach(s => { if (s.status === 'pending') cellsOf(s).forEach(([e, d]) => swapCells.add(d + '_' + e)); else if (s.status === 'approved') cellsOf(s).forEach(([e, d]) => swapDone.add(d + '_' + e)); });
  if (adminTab === 'swaps') return (
    <div className="space-y-4">
      <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 print-hide">
        <div className="flex bg-slate-100 p-1.5 rounded-xl w-fit max-w-full overflow-x-auto">{tabBtn('logs', 'ประวัติ')}{tabBtn('summary', 'สรุป OT')}{tabBtn('schedules', 'ตารางเวร')}{tabBtn('exceptions', 'รายงานผิดปกติ')}{tabBtn('swaps', swTabLabel)}</div>
      </div>
      <SwapApprovals role={role} user={user} employees={employees} schedules={schedules} records={records} settings={settings} swaps={swaps} reload={reload} />
    </div>
  );

  return (
    <div className="mt-2 pb-12">
      <BusySpinner />
      {isMatrix && filterDept && <SchedPrintSheet mode={adminTab} showLate={adminTab === 'summary' && showLate} rows={summaryMatrix} types={types} daysArray={daysArray} dayStr={dayStr} schedules={schedules} getDaily={getDaily} my={my} mm={mm} dept={filterDept} matrixMonth={matrixMonth} workDays={localWorkDays} pub={pub} user={user} />}
      <div className={`hidden ${isMatrix && filterDept ? '' : 'print-show'} text-center mb-6`}>
        <h2 className="text-2xl font-bold text-black mb-1">{title}</h2>
        <p className="text-base font-bold text-gray-700">แผนก: {filterDept || 'ทั้งหมด'} | ประจำเดือน: {matrixMonth}</p>
      </div>

      {mapRec && <MapModal lat={mapRec.lat} lon={mapRec.lon} onClose={() => setMapRec(null)} />}
      {photoRec && <PhotoModal record={photoRec} employees={employees} onClose={() => setPhotoRec(null)} />}

      {editData && <Modal><div className="p-6"><h3 className="font-bold text-slate-800 mb-4">แก้ไขประวัติ</h3><div className="space-y-4 text-sm">
        <ShiftSelect dept={employees[editData.empId]?.dept} leave={leaveOptions} value={editData.shiftId} onChange={v => setEditData({ ...editData, shiftId: v, lateMinutes: calcLate(schedules, editData.empId, editData.date, v, editData.timeIn) })} />
        <div className="flex gap-2">
          <label className="w-full"><span className="block text-xs font-bold text-slate-500 mb-1">เวลาเข้า</span>
            <input type="time" value={editData.timeIn} onChange={e => setEditData({ ...editData, timeIn: e.target.value, lateMinutes: calcLate(schedules, editData.empId, editData.date, editData.shiftId, e.target.value) })} className="w-full p-2.5 rounded-xl border border-slate-300 font-semibold" /></label>
          <label className="w-full"><span className="block text-xs font-bold text-slate-500 mb-1">เวลาออก</span>
            <input type="time" value={editData.timeOut || ''} onChange={e => setEditData({ ...editData, timeOut: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 font-semibold" /></label>
        </div>
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1" htmlFor="edit-late">มาสาย (นาที) · 0 = ไม่สาย</label>
          <div className="flex gap-2 items-center">
            <input id="edit-late" type="number" min="0" max="720" inputMode="numeric" value={editData.lateMinutes} onChange={e => setEditData({ ...editData, lateMinutes: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 font-semibold" />
            <button type="button" onClick={() => setEditData({ ...editData, lateMinutes: 0 })} className="shrink-0 h-11 px-3 rounded-xl border border-slate-300 text-slate-600 font-bold hover:bg-slate-50">ไม่สาย</button>
            <button type="button" onClick={() => setEditData({ ...editData, lateMinutes: calcLate(schedules, editData.empId, editData.date, editData.shiftId, editData.timeIn) })} className="shrink-0 h-11 px-3 rounded-xl border border-slate-300 text-slate-600 font-bold hover:bg-slate-50">คำนวณใหม่</button>
          </div>
          <p className="text-xs text-slate-500 mt-1">แก้เวลาเข้าแล้วระบบคำนวณให้อัตโนมัติ (เผื่อ 5 นาทีหลังเริ่มกะ) แอดมินพิมพ์แก้เองได้</p>
        </div>
        <Actions onCancel={() => setEditData(null)} onOk={saveEdit} okText="บันทึก" disabled={saving} />
      </div></div></Modal>}

      {addData && <Modal><div className="p-6"><h3 className="font-bold text-slate-800 mb-4">เพิ่มข้อมูลย้อนหลัง</h3><div className="space-y-3 text-sm">
        <input type="text" placeholder="รหัสพนักงาน (EMP01)" value={addData.empId} onChange={e => setAddData({ ...addData, empId: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
        <input type="date" value={addData.date} onChange={e => setAddData({ ...addData, date: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
        <ShiftSelect dept={employees[addData.empId]?.dept} leave={leaveOptions} empty="-- เลือกกะ --" value={addData.shiftId} onChange={v => setAddData({ ...addData, shiftId: v })} />
        <div className="flex gap-2">
          <input type="time" value={addData.timeIn} onChange={e => setAddData({ ...addData, timeIn: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
          <input type="time" value={addData.timeOut} onChange={e => setAddData({ ...addData, timeOut: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
        </div>
        <Actions onCancel={() => setAddData(null)} onOk={saveAdd} okText={saving ? 'บันทึก...' : 'เพิ่มข้อมูล'} disabled={saving} />
      </div></div></Modal>}

      {diffOpen && settings?.payroll?.[matrixMonth] && <PayDiffModal ym={matrixMonth} snap={settings.payroll[matrixMonth]} role={role} user={user} employees={employees} records={records} schedules={schedules} defDept={filterDept} onClose={() => setDiffOpen(false)} />}
      {otOpen && <OtReportModal kind={otOpen} schedules={schedules} role={role} user={user} employees={employees} swaps={swaps} records={records} defMonth={matrixMonth} defDept={filterDept} onClose={() => setOtOpen(false)} />}
      {adjCell && <AdjustModal user={user} employees={employees} schedules={schedules} records={records} settings={settings} targetId={adjCell.empId} fixedDate={adjCell.ds} onClose={() => setAdjCell(null)} onSent={async () => { setAdjCell(null); await reload(); }} />}
      {cellData && <Modal><div className="p-6">
        <h3 className="font-bold text-slate-800 mb-1">จัดการเวร <span className="text-slate-500 font-semibold text-sm ml-2">{formatDisplayDate(cellData.dateStr)}</span></h3>
        <p className="text-xs font-bold text-primary mb-4">{employees[cellData.empId]?.fname}</p>
        <div className="space-y-2 max-h-48 overflow-y-auto mb-4 pr-1">
          {cellData.shifts.map((s, i) => (
            <div key={i} className="flex gap-2">
              {LEAVE_LOCK.includes(s) ? <div className="flex-1 p-2 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-sm font-bold flex items-center gap-2"><i className="fa-solid fa-lock text-xs"></i>{s}</div> : <ShiftSelect dept={employees[cellData.empId]?.dept} leave={leaveOptions} empty="- ว่าง -" value={s} cls="flex-1 p-2 border border-slate-300 rounded-xl text-sm font-semibold bg-slate-50" onChange={v => { const a = [...cellData.shifts]; a[i] = v; setCellData({ ...cellData, shifts: a }); }} />}
              <button onClick={() => setCellData({ ...cellData, shifts: cellData.shifts.filter((_, k) => k !== i) })} className="w-10 h-10 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors"><i className="fa-solid fa-trash-can"></i></button>
            </div>
          ))}
        </div>
        <button onClick={() => setCellData({ ...cellData, shifts: [...cellData.shifts, ''] })} className="w-full p-2.5 border-2 border-dashed border-slate-300 text-slate-500 font-bold rounded-xl text-sm mb-4 hover:bg-slate-50 transition-colors">+ เพิ่มกะ</button>
        <Actions onCancel={() => setCellData(null)} onOk={saveCell} okText="บันทึก" />
      </div></Modal>}

      {autoOpen && <Modal wide><div className="p-6 max-h-[88vh] overflow-y-auto"><h3 className="font-bold text-slate-800 mb-3">จัดเวรอัตโนมัติ <span className="text-xs font-semibold text-slate-400 ml-1">{filterDept}</span></h3><div className="space-y-3 text-sm">
        <div className="flex bg-slate-100 p-1 rounded-xl">{[['frame', 'ตามกรอบกำลัง'], ['single', 'ใส่กะเดียว']].map(([k, l]) => <button key={k} onClick={() => { setAutoMode(k); setPlan(null); }} className={`flex-1 py-2 rounded-lg font-bold ${autoMode === k ? 'bg-white text-primary shadow-sm' : 'text-slate-500'}`}>{l}</button>)}</div>

          <div className="flex justify-between px-3 py-2 border-b border-slate-100 text-xs font-bold"><span>พนักงานที่จะจัด ({autoEmps.length}/{dropdownEmps.length})</span><span><button onClick={() => setAutoEmps(dropdownEmps)} className="text-primary mr-3">ทั้งหมด</button><button onClick={() => setAutoEmps([])} className="text-slate-500">ล้าง</button></span></div>
          <div className="max-h-32 overflow-y-auto p-2 grid grid-cols-2 gap-1">{dropdownEmps.map(id => <label key={id} className="flex items-center gap-2 p-1 cursor-pointer"><input type="checkbox" checked={autoEmps.includes(id)} onChange={e => setAutoEmps(p => e.target.checked ? [...p, id] : p.filter(x => x !== id))} className="w-4 h-4" /><span className="truncate font-semibold text-slate-700">{employees[id].fname}</span></label>)}</div>

        {autoMode === 'single' ? <>
          <ShiftSelect dept={filterDept} leave={leaveOptions} empty="-- เลือกกะ --" value={auto.shiftId} onChange={v => setAuto({ ...auto, shiftId: v })} cls="w-full p-3 rounded-xl border border-slate-300 font-semibold" />

        </div>
      )}

      {isMatrix && filterDept && adminTab === 'schedules' && pub.st !== 'legacy' && (
        <div className={`mb-3 rounded-2xl border p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 print-hide ${locked ? 'border-emerald-200 bg-emerald-50 text-emerald-900' : 'border-amber-200 bg-amber-50 text-amber-900'}`}>
          <div className="min-w-0 text-sm font-semibold">
            <p className="font-head font-semibold text-base flex items-center gap-2"><i className={`fa-solid ${locked ? 'fa-lock' : 'fa-pen-to-square'}`} aria-hidden="true"></i>{locked ? 'ส่งตารางเวรแล้ว' : pub.st === 'reopened' ? 'ปลดล็อกกลับมาแก้ไข (ฉบับร่าง)' : 'ฉบับร่าง · พนักงานยังไม่เห็น'}</p>
            {locked ? <p>ส่งเมื่อ {formatDisplayDate(pub.at?.slice(0, 10))} {pub.at?.slice(11, 16)} น. โดย {pub.name || pub.by} · แตะช่องเพื่อเพิ่ม / แก้เวร (เก็บประวัติในคำขอเปลี่ยนเวร)</p>
              : pub.st === 'reopened' ? <p>แอดมินปลดล็อกเมื่อ {formatDisplayDate(pub.at?.slice(0, 10))}{pub.reason ? ` · ${pub.reason}` : ''} · แก้เสร็จแล้วกดส่งใหม่</p>
              : <p>แก้ไขและบันทึกได้เรื่อย ๆ ช่องที่แก้ยังไม่ติดจุดส้ม · ตรวจครบแล้วกด "ส่งยืนยันตารางเวร"</p>}
          </div>
          {!locked && canPub && <button onClick={publish} className="shrink-0 h-11 px-5 rounded-full bg-primary hover:opacity-90 text-white text-sm font-bold shadow-sm"><i className="fa-solid fa-paper-plane mr-1.5"></i>ส่งยืนยันตารางเวร</button>}
          {locked && role === 'admin' && <button onClick={unlock} className="shrink-0 h-11 px-5 rounded-full bg-white border border-emerald-300 text-emerald-900 text-sm font-bold"><i className="fa-solid fa-lock-open mr-1.5"></i>ปลดล็อกกลับเป็นร่าง</button>}
        </div>
      )}
      {isMatrix && filterDept && adminTab === 'schedules' && (
        <div className="flex flex-wrap gap-x-4 gap-y-1 mb-2 px-1 text-xs font-semibold text-slate-500 print-hide">
          <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-sky-500"></span>มีคำขอเปลี่ยนเวรรออนุมัติ</span>
          <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500"></span>เปลี่ยนจากคำขอที่อนุมัติแล้ว</span>
          <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-orange-400"></span>แก้ไขจากค่าเดิม</span>
        </div>
      )}
      {isMatrix && filterDept && (
        <div className={`bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm ${isMatrix ? 'print-hide' : 'print-table-wrapper'}`}><div className="overflow-auto max-h-[70dvh] scroll-frame">
          <table className="min-w-full text-left" style={{ tableLayout: 'fixed' }}>
            <thead className="bg-slate-50 border-b border-slate-200 sticky top-0 z-30">
              <tr>
                <th rowSpan="2" className="px-2 py-3 font-extrabold text-slate-800 text-sm sticky left-0 bg-slate-50 z-20 border-r border-slate-200" style={{ width: '13%' }}>พนักงาน</th>
                {daysArray.map(d => { const di = new Date(my, mm - 1, d).getDay(), wk = di === 0 || di === 6; return <th key={d} rowSpan="2" className={`day-col px-1 py-1.5 text-center text-xs font-extrabold ${wk ? 'text-rose-600 bg-rose-50/50' : 'text-slate-500'}`}><span className="block text-xs font-semibold opacity-75">{dayName[di]}</span>{d}</th>; })}
                <th colSpan={types.length} className="px-1 py-1.5 font-extrabold text-primary text-center bg-pink-50/50 border-l border-b border-pink-100 border-r border-slate-200 text-xs uppercase tracking-widest" style={{ width: `${types.length * 2.5}%` }}>สรุปกะเวร</th>
                <th rowSpan="2" className="px-1 py-3 text-center text-xs font-extrabold text-slate-700 bg-slate-100/50 border-l border-slate-200" style={{ width: '4%' }}>รวม</th>
                <th rowSpan="2" className="px-1 py-3 text-center text-xs font-extrabold text-slate-800 bg-slate-100/50 border-l border-slate-200" style={{ width: '4%' }}>ทำงาน</th>
                <th rowSpan="2" className="px-1 py-3 text-center text-xs font-extrabold text-white bg-primary border-l border-pink-600" style={{ width: '4%' }}>OT</th>
                {showLate && <th rowSpan="2" className="px-1 py-3 text-center text-xs font-extrabold text-red-700 bg-red-50 border-l border-red-200" style={{ width: '4%' }}>สาย<br />(นาที)</th>}
              </tr>
              <tr>{types.map(t => <th key={t} className="px-1 py-1 font-extrabold text-primary text-center bg-pink-50/50 border-x border-white text-xs">{t}</th>)}</tr>
            </thead>
            <tbody className="divide-y divide-slate-100 text-sm">
              {summaryMatrix.map(row => (
                <tr key={row.empId} className="hover:bg-pink-50/30 transition-colors">
                  <td className="px-2 py-2 sticky left-0 bg-white z-10 border-r border-slate-200"><p className="font-bold text-slate-800 leading-tight truncate">{row.fname}</p><p className="text-xs font-semibold text-slate-400 truncate mt-0.5">{row.empId} • {row.level}</p></td>
                  {daysArray.map(d => {
                    const wk = [0, 6].includes(new Date(my, mm - 1, d).getDay());
                    if (adminTab === 'schedules') {
                      const ds = dayStr(d), o = schedules[ds]?.[row.empId];
                      return <td key={d} onClick={() => openCell(row.empId, ds, o)} className={`day-col px-0.5 py-2 text-center cursor-pointer border-r border-slate-50 hover:bg-slate-100 transition-colors relative ${wk ? 'bg-rose-50/30' : ''}`}>
                        {swapDone.has(ds + '_' + row.empId) ? <div className="absolute top-1 right-1 w-2 h-2 bg-emerald-500 rounded-full print-hide" title="เปลี่ยนเวรจากคำขอที่อนุมัติแล้ว"></div>
                          : o?.isEdited && <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-orange-400 rounded-full print-hide" title="แก้ไขจากค่าเดิม"></div>}
                        {swapCells.has(ds + '_' + row.empId) && <div className="absolute top-1 left-1 w-2 h-2 bg-sky-500 rounded-full print-hide" title="มีคำขอสลับเวรรออยู่"></div>}
                        <div className="flex flex-col gap-0.5 items-center">{(o?.shifts || []).map((s, i) => <span key={i} className="shift-chip bg-white text-slate-800 border border-slate-300 px-1 py-0.5 rounded shadow-sm text-xs font-bold">{s}</span>)}</div></td>;
                    }
                    const { ui, absent } = row.shiftsByDay[d];
                    return <td key={d} className={`day-col px-0.5 py-1.5 text-center text-xs font-bold border-r border-slate-50 align-middle ${absent ? 'bg-red-50 ring-1 ring-inset ring-red-200' : (ui.length ? 'bg-slate-50/40' : '')} ${wk && !ui.length ? 'bg-rose-50/30' : ''}`}>
                      {ui.length ? <div className="flex flex-col gap-0.5 items-center justify-center my-0.5">{ui.map((e, i) => <span key={i} className={`shift-chip text-xs font-bold px-1 py-0.5 rounded border ${chipCls[e.type]}`} title={e.type === 'pending' ? 'กะล่วงหน้า/รอสแกน' : ''}>{e.shift}</span>)}</div> : <span className="text-slate-300">-</span>}</td>;
                  })}
                  {types.map(t => <td key={t} className="px-1 py-2 text-center font-bold text-primary bg-pink-50/30 border-x border-slate-50 text-xs">{row.shiftCounts[t] || 0}</td>)}
                  <td className="px-1 py-2 text-center font-extrabold text-slate-800 bg-slate-50/50 border-l border-slate-200">{row.credit}</td>
                  <td className="px-1 py-2 text-center font-bold text-slate-500 bg-slate-50/50 border-l border-slate-200 text-xs">{row.temp ? '-' : localWorkDays}</td>
                  <td className="px-1 py-2 text-center font-extrabold text-primary bg-pink-50 border-l border-pink-100" title={row.temp ? 'รายวัน / Parttime ไม่คิด OT' : undefined}>{row.temp ? '-' : row.ot > 0 ? `+${row.ot}` : row.ot}</td>
                  {showLate && <td className="px-1 py-2 text-center font-extrabold text-red-600 bg-red-50 border-l border-red-200">{row.late > 0 ? row.late : '-'}</td>}
                </tr>
              ))}
              {summaryMatrix.length > 0 && (
                <tr className="bg-amber-50/80 border-t-2 border-amber-200">
                  <td className="px-2 py-3 sticky left-0 bg-amber-50 z-10 border-r border-slate-200 font-extrabold text-slate-800 text-right text-xs">สรุปอัตรากำลัง/วัน</td>
                  {daysArray.map(d => {
                    const counts = getDaily(d), wk = [0, 6].includes(new Date(my, mm - 1, d).getDay());
                    return <td key={d} className={`day-col px-0.5 py-1 text-center border-r border-slate-200 align-top ${wk ? 'bg-rose-50/50' : ''}`}>
                      {Object.keys(counts).length ? <div className="flex flex-col gap-0.5 mt-1 pb-1">{Object.entries(counts).sort((a, b) => byCat(a[0], b[0])).map(([s, c]) => <div key={s} className="text-xs font-extrabold text-slate-700 leading-tight">{s}: <strong className="text-primary">{c}</strong></div>)}</div> : <span className="text-slate-300">-</span>}</td>;
                  })}
                  <td colSpan={types.length + (showLate ? 4 : 3)} className="bg-amber-50 border-l border-slate-200"></td>
                </tr>
              )}
            </tbody>
          </table>
        </div></div>
      )}
      {isMatrix && !filterDept && (
        <div className="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm print-hide">
          <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100"><i className="fa-solid fa-building text-3xl text-primary/50"></i></div>
          <h3 className="text-lg font-bold text-slate-800 mb-1">ยังไม่ได้เลือกแผนก</h3>
          <p className="text-slate-500 font-medium">กรุณาเลือกแผนกจากเมนูด้านบนเพื่อดูตารางเวร</p>
        </div>
      )}
    </div>
  );
}
</script>

</body>
</html>
