<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ================= ตั้งค่า =================
const GAS_URL = "https://script.google.com/macros/s/AKfycbwN_t3I53y5PoZY0lGVENHiTvR7Ne_K_OxvTjxfCaAUqyLt3lPPLLBY4gQ8XC2V8ddK/exec";
const LEAVE_SYSTEM_URL = "https://raksakon-time.github.io/raksakon-leave-web/";
const HOSPITAL_LAT = 17.162383247325145, HOSPITAL_LON = 104.14513206230059, ALLOWED_RADIUS = 100;

const POLL_MS = 30000; // ความถี่ตรวจข้อมูลใหม่ (มิลลิวินาที)

// กะ: [เริ่ม, เลิก, เครดิต] — label สร้างอัตโนมัติ
const SHIFT_DEF = {
  'ด': ['00:00','08:00',1], 'ช616': ['06:00','16:00',1.25], 'ช618': ['06:00','18:00',1.5], 'ช619': ['06:00','19:00',1.625],
  'ช6': ['06:00','14:00',1], 'ช716': ['07:00','16:00',1.125], 'ช719': ['07:00','19:00',1.5], 'ช7': ['07:00','15:00',1],
  'ช21': ['07:00','21:00',1.75], 'ชบ7': ['07:00','23:00',2], 'ช': ['08:00','16:00',1], 'ชบ': ['08:00','00:00',2],
  'ช20': ['08:00','20:00',1.5], 'ช83': ['08:30','16:30',1], 'ช9': ['09:00','21:00',1.5], 'ช917': ['09:00','17:00',1],
  'บ15': ['15:00','23:00',1], 'บ': ['16:00','00:00',1], 'บด': ['16:00','08:00',2], 'บ4': ['17:00','21:00',0.5]
};
const SHIFT_TYPES = Object.fromEntries(Object.entries(SHIFT_DEF).map(([k, [start, end, credit]]) =>
  [k, { start, end, credit, label: `${start.replace(':', '.')} - ${end.replace(':', '.')} (${k})` }]));
const NON_WORK = ['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ลาชั่วโมง', 'ขาด'];
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MON_S = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const THAI_DAYS = ['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'];

const APP_BUILD = '24/11/69-จ';   // เปลี่ยนทุกครั้งที่ปล่อยไฟล์ใหม่ เพื่อเช็กว่าเครื่องไหนโหลดฉบับไหน
// ================= ธีมสี (เก็บตามเครื่องใน localStorage) =================
const THEMES = [
  { key: 'pink', name: 'ชมพู (แบบเดิม)', desc: 'โทนอบอุ่น ชมพูกุหลาบ', sw: ['#db2777', '#9d174d', '#fce7f3'] },
  { key: 'navy', name: 'น้ำเงินกรมท่า + แดงปะการัง', desc: 'โทนทางการ สไตล์องค์กรการแพทย์', sw: ['#2A3C76', '#D6393F', '#E8ECF7'] }
];
const themeHex = k => getComputedStyle(document.documentElement).getPropertyValue('--hex-' + k).trim() || '#db2777';

// ================= Helpers =================
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const fmtInput = d => ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
const formatTime24 = d => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const formatDisplayDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${parseInt(y, 10) + 543}`; };
const formatFullThaiDate = d => d ? `${THAI_DAYS[d.getDay()]}ที่ ${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}` : '';
const displaySafeTime = t => !t ? '-' : (t.includes('T') ? t.split('T')[1].substring(0, 5) : t) + ' น.';
const driveImg = (url, size) => { const m = url && url.match(/[-\w]{25,}/); return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=${size}` : url || null; };
const shiftsOf = (sch, date, id) => { const o = sch[date]?.[id]; return o?.shifts || (Array.isArray(o) ? o : []); };
const distM = (a, b, c, d) => {
  const r = x => x * Math.PI / 180, h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
};

// ช่วง 00:00-03:59 ให้นับเป็นกะของเมื่อวานถ้ามีเวรเมื่อวาน (shift ไม่ระบุ = มีเวรเมื่อวานก็ใช้)
// นาทีที่สายของการลงเวลาเข้า (เผื่อ 5 นาที + กติกาลาชั่วโมง) ใช้ร่วมกันตอนสแกนเข้าและตอนแอดมินแก้ไขประวัติ
const calcLate = (sch, empId, date, shiftId, timeIn) => {
  const sd = SHIFT_TYPES[shiftId];
  if (!sd || !/^\d{2}:\d{2}/.test(timeIn || '')) return 0;
  const [h, m] = sd.start.split(':').map(Number), tm = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
  const actual = tm(timeIn), deadline = h * 60 + m + 5, cell = sch?.[date]?.[empId] || {};
  let dl = deadline;
  if ((cell.shifts || []).includes('ลาชั่วโมง')) {
    // ไม่ทราบเวลาลา หรือ ลาครอบเวลาเริ่มกะ = ไม่นับสาย / ลาช่วงอื่น (เช่น ท้ายกะ) = นับสายตามปกติ
    const lt = cell.leaveTime || '';
    const cover = lt.split(';').filter(Boolean).map(x => x.split('-').map(tm)).find(([a, b]) => a <= h * 60 + m && b > h * 60 + m);
    dl = !lt || cover ? Infinity : deadline;
  }
  return actual > dl && actual < dl + 720 ? actual - dl : 0;
};
const resolveTarget = (now, sch, id, shift) => {
  if (now.getHours() <= 3) {
    const y = fmtInput(new Date(now.getTime() - 864e5)), ys = shiftsOf(sch, y, id);
    if (shift === undefined ? ys.length > 0 : ys.includes(shift)) return { date: y, shifts: ys };
  }
  const t = fmtInput(now);
  return { date: t, shifts: shiftsOf(sch, t, id) };
};

let pendingWrites = 0, writeSeq = 0, syncing = false;
// สถานะ "กำลังประมวลผล" ให้หน้าจัดการแสดงวงกลมหมุน
let uiBusy = 0;
const busySubs = new Set();
const busyAdd = n => { uiBusy = Math.max(0, uiBusy + n); busySubs.forEach(f => f(uiBusy)); };
const sendToGoogleSheet = async (action, payload = {}, retries = 3) => {
  const write = action !== 'getInitialData';
  if (write) { pendingWrites++; writeSeq++; busyAdd(1); }
  try { return await postToSheet_(action, payload, retries); }
  finally { if (write) { pendingWrites--; writeSeq++; busyAdd(-1); } }
};
// วงกลมหมุนกลางจอ ขึ้นเมื่อรอเกิน 0.3 วินาที และกันการกดซ้ำระหว่างรอ
const BusySpinner = () => {
  const [n, setN] = useState(uiBusy), [show, setShow] = useState(false), [long, setLong] = useState(false);
  useEffect(() => { busySubs.add(setN); return () => busySubs.delete(setN); }, []);
  useEffect(() => {
    if (!n) { setShow(false); setLong(false); return; }
    const a = setTimeout(() => setShow(true), 300), b = setTimeout(() => setLong(true), 8000);
    return () => { clearTimeout(a); clearTimeout(b); };
  }, [n > 0]);
  if (!show) return null;
  return (
    <div className="fixed inset-0 z-[1050] bg-white/40 flex items-center justify-center print-hide" role="status" aria-live="polite">
      <div className="bg-white rounded-3xl shadow-xl border border-slate-100 px-7 py-5 flex flex-col items-center gap-3">
        <div className="w-11 h-11 rounded-full border-4 border-pink-100 border-t-primary animate-spin" aria-hidden="true"></div>
        <p className="font-semibold text-slate-700">กำลังประมวลผล...</p>
        {long && <p className="text-xs text-slate-500 text-center">ระบบกำลังบันทึก อาจใช้เวลาสักครู่<br />กรุณาอย่าปิดหน้านี้</p>}
      </div>
    </div>
  );
};
const postToSheet_ = async (action, payload = {}, retries = 3) => {
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
      const data = await res.json();
      // คิวบันทึกเต็ม (มีคนอื่นกำลังบันทึก) -> รอแล้วส่งใหม่อัตโนมัติ ไม่ต้องให้ผู้ใช้กดซ้ำ
      const busy = data.status === 'error' && /LOCK_BUSY|ล็อก|lock/i.test(String(data.message || ''));
      if (busy && i < retries - 1) { await new Promise(r => setTimeout(r, 2000 + Math.random() * 2000)); continue; }
      if (busy) data.message = 'ระบบกำลังบันทึกรายการของผู้อื่นอยู่ กรุณารอสักครู่แล้วกดบันทึกอีกครั้ง';
      if (data.status === 'error') Swal.fire({ title: 'แจ้งเตือน', text: data.message, icon: 'warning', confirmButtonColor: themeHex('p') });
      return data;
    } catch (e) {
      console.warn(`การเชื่อมต่อล้มเหลวครั้งที่ ${i + 1}: ${e.message}`);
      if (i === retries - 1) {
        Swal.fire({ title: 'ข้อผิดพลาดเครือข่าย', text: 'การเชื่อมต่อล้มเหลว กรุณาตรวจสอบอินเทอร์เน็ตของท่าน', icon: 'error', confirmButtonColor: themeHex('p') });
        return { status: 'error', message: e.message };
      }
      await new Promise(r => setTimeout(r, 1500));
    }
  }
};

const captureImage = v => {
  if (!v || !v.videoWidth || !v.videoHeight) return null;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  c.width = v.videoWidth * .5; c.height = v.videoHeight * .5;
  ctx.translate(c.width, 0); ctx.scale(-1, 1); ctx.drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .6).split(',')[1];
};

function useCamera(active, onFail) {
  const ref = useRef(null);
  useEffect(() => {
    if (!active) return;
    let dead = false, tries = 0, timer, stream = null;
    // เก็บ stream ไว้ในตัวแปรนี้เสมอ เพื่อปิดกล้องได้แม้ element วิดีโอถูกถอดไปแล้ว (เดิมกล้องค้างจนเปิดใหม่ได้ภาพดำบน iOS)
    const release = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
    const start = () => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
      if (dead) { s.getTracks().forEach(t => t.stop()); return; }   // ผลมาช้าหลังปิดไปแล้ว: ปล่อยกล้องทิ้ง
      release(); stream = s;
      const v = ref.current;
      if (v) { v.srcObject = s; const p = v.play && v.play(); if (p && p.catch) p.catch(() => {}); }
      // ถ้า 4 วินาทียังไม่มีภาพ (ภาพดำ) ให้เปิดกล้องใหม่ ลองซ้ำไม่เกิน 3 ครั้ง
      timer = setTimeout(() => { if (!dead && ref.current && !ref.current.videoWidth && ++tries < 3) { release(); start(); } }, 4000);
    }).catch(err => { if (!dead) onFail(err); });
    start();
    return () => { dead = true; clearTimeout(timer); release(); if (ref.current) ref.current.srcObject = null; };
  }, [active]);
  return ref;
}

// ================= UI ใช้ร่วมกัน =================
const TONE = {
  primary: { soft: 'bg-pink-50 text-primary border-pink-100', ico: 'bg-pink-100 text-primary', text: 'text-primary', btn: 'bg-primary hover:bg-pink-700', main: 'bg-primary hover:bg-pink-700' },
  secondary: { soft: 'bg-rose-50 text-secondary border-rose-100', ico: 'bg-rose-100 text-secondary', text: 'text-secondary', btn: 'bg-secondary hover:bg-pink-900', main: 'bg-secondary hover:bg-pink-900' }
};
const CARD = 'bg-white rounded-3xl shadow-sm border border-slate-100';
const FIELD = 'w-full min-w-0 max-w-full p-3 sm:p-3.5 border border-slate-300 rounded-xl bg-white outline-none font-semibold text-slate-800';
const LABEL = 'block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider';

const Panel = ({ children }) => <div className="space-y-3 animate-fade-in">{children}</div>;

const ErrorBox = ({ msg }) => msg ? <div className="p-3 bg-red-50 text-red-600 rounded-lg text-sm flex items-start gap-2 border border-red-100 font-medium"><i className="fa-solid fa-circle-exclamation mt-0.5"></i> <span>{msg}</span></div> : null;

// กล้องแบบวงกลม: วงแหวนสีหลักของธีมวิ่งรอบตามเวลาที่ใบหน้านิ่ง (prog 0-1) เต็มรอบเมื่อบันทึก พร้อมป้าย %
const RING_C = 2 * Math.PI * 43;
const CameraBox = ({ active, vref, onOpen, disabled, label, found, ready, dbg, prog, saving }) => {
  const p = saving ? 1 : found ? Math.min(1, prog || 0) : 0, pct = Math.round(p * 100);
  const size = 'w-[min(16rem,64vw,34dvh)] h-[min(16rem,64vw,34dvh)]';
  const ring = (
    <svg aria-hidden="true" viewBox="0 0 100 100" className="absolute inset-0 w-full h-full pointer-events-none">
      <circle cx="50" cy="50" r="49" fill="none" stroke="rgb(var(--p300))" strokeWidth="0.9" strokeLinecap="round" strokeDasharray="0.1 4.3" />
      <circle cx="50" cy="50" r="43" fill="none" stroke="rgb(var(--p100))" strokeWidth="6" />
      <circle cx="50" cy="50" r="43" fill="none" stroke="rgb(var(--primary))" strokeWidth="6" strokeLinecap="round" strokeDasharray={RING_C} strokeDashoffset={RING_C * (1 - p)} transform="rotate(-90 50 50)" style={{ transition: 'stroke-dashoffset 80ms linear' }} />
    </svg>
  );
  return (
    <div className="flex flex-col items-center gap-3 pt-2">
      {active ? <>
        <div className={`relative ${size}`}>
          <video ref={vref} autoPlay playsInline muted className="absolute left-[13%] top-[13%] w-[74%] h-[74%] rounded-full object-cover transform scale-x-[-1] bg-slate-900" />

// ================= ตรวจใบหน้าเข้ากรอบ (face-api tinyFaceDetector เท่านั้น ~190KB) =================
const FACE_MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const FACE_HOLD_MS = 2500;   // ใบหน้าต้องอยู่ในกรอบนิ่งต่อเนื่องกี่มิลลิวินาทีก่อนบันทึกอัตโนมัติ (เพิ่ม = ช้าลง)
const FACE_DEBUG = false; // ชั่วคราว: แสดงสถานะตัวตรวจใบหน้าบนกรอบกล้องเพื่อหาสาเหตุ (ตั้ง false เมื่อใช้งานจริง)
const MANUAL_FALLBACK = true; // true = ถ้าสแกนอัตโนมัติไม่ติด (โหลดตัวตรวจไม่ได้/เกิน 20 วินาที) จะมีปุ่มบันทึกเองให้กด
let liteReady = null, liteDone = false;
const loadFaceLite = () => liteReady || (liteReady = (async () => {
  if (!window.faceapi) throw new Error('faceapi not loaded');
  await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS);
  // วอร์มอัป: ตรวจภาพเปล่า 1 ครั้งเพื่อเตรียมตัวประมวลผล (ครั้งแรกช้า) ให้การสแกนจริงเร็ว
  const c = document.createElement('canvas'); c.width = c.height = 96;
  try { await faceapi.detectSingleFace(c, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 })); } catch (e) { console.warn('face warm-up', e); }
  liteDone = true;
})().catch(e => { liteReady = null; throw e; }));

// ใบหน้าอยู่กลางกรอบ -> คืน true (กรอบเขียว) และถ้าอยู่นิ่งต่อเนื่อง เรียก onStable ครั้งเดียวเพื่อบันทึกอัตโนมัติ
// ถ้าตัวตรวจใบหน้าโหลดไม่ได้จะไม่ทำอะไร ผู้ใช้กดปุ่มยืนยันเองได้ตามเดิม
function useFaceFrame(vref, active, onStable) {
  const [found, setFound] = useState(false), [manual, setManual] = useState(false), [ready, setReady] = useState(liteDone), [dbg, setDbg] = useState(''), [prog, setProg] = useState(0), sinceRef = useRef(0), cb = useRef(onStable);
  cb.current = onStable;
  useEffect(() => {
    if (!active) return;
    const t = setInterval(() => setProg(sinceRef.current ? Math.min(1, (performance.now() - sinceRef.current) / FACE_HOLD_MS) : 0), 50);
    return () => clearInterval(t);
  }, [active]);
  useEffect(() => {
    if (!active) { setFound(false); setManual(false); setProg(0); return; }
    let stop = false, hits = 0, n = 0, lastErr = '';
    sinceRef.current = 0;
    const t = setTimeout(() => setManual(true), 20000);
    (async () => {
      for (;;) {   // โหลดไม่สำเร็จให้ลองใหม่เรื่อย ๆ (ระหว่างนั้นปุ่มสำรองจะโผล่ให้กดเองได้)
        try { await loadFaceLite(); break; } catch (e) { setManual(true); await new Promise(res => setTimeout(res, 2000)); if (stop) return; }
      }
      if (stop) return;
      setReady(true);
      while (!stop) {
        const v = vref.current;
        if (v && v.videoWidth && v.readyState >= 2) {   // รอให้เฟรมแรกพร้อมก่อน (ถ้าไม่รออาจเกิด error ในรอบแรก)
          const t0 = performance.now();
          let r = null;
          try { r = await faceapi.detectSingleFace(v, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 })); }
          catch (e) { lastErr = String((e && e.message) || e).slice(0, 40); console.warn('face detect error', e); }   // ข้ามรอบนี้ ไม่ให้การสแกนหยุดทั้งหมด
          if (stop) break;
          const b = r && r.box, W = v.videoWidth, H = v.videoHeight;
          const ok = !!b && b.width > W * .22 && Math.abs(b.x + b.width / 2 - W / 2) < W * .25 && Math.abs(b.y + b.height / 2 - H / 2) < H * .25;
          n++;
          if (FACE_DEBUG) setDbg(`${W}x${H} rs${v.readyState} #${n} ${Math.round(performance.now() - t0)}ms ` + (b ? `หน้า w${Math.round(b.width / W * 100)}% x${Math.round((b.x + b.width / 2) / W * 100)}% y${Math.round((b.y + b.height / 2) / H * 100)}%` : 'ไม่พบหน้า') + (lastErr ? ' ERR:' + lastErr : ''));
          hits = ok ? hits + 1 : 0;
          if (!ok) sinceRef.current = 0; else if (!sinceRef.current) sinceRef.current = performance.now();
          setFound(hits >= 1);
          if (hits >= 4 && performance.now() - sinceRef.current >= FACE_HOLD_MS) { stop = true; cb.current(); break; }
        } else if (FACE_DEBUG) setDbg('รอวิดีโอ ' + (v ? v.videoWidth + 'x' + v.videoHeight + ' rs' + v.readyState : 'ไม่มี element'));
        await new Promise(res => setTimeout(res, 100));
      }
    })();
    return () => { stop = true; clearTimeout(t); };
  }, [active]);
  return { found, manual: MANUAL_FALLBACK && manual, ready, dbg, prog };
}

// ================= ขอสลับเวร (พนักงานขอ -> หัวหน้าอนุมัติ -> ตารางเวรเปลี่ยนเอง) =================
const SW_STATUS = {
  pending: ['รอหัวหน้า', 'bg-amber-100 text-amber-800'], approved: ['อนุมัติแล้ว', 'bg-emerald-100 text-emerald-800'],
  rejected: ['ไม่อนุมัติ', 'bg-slate-100 text-slate-700'], cancelled: ['ยกเลิกแล้ว', 'bg-slate-100 text-slate-700'], invalid: ['ใช้ไม่ได้ ขอใหม่', 'bg-rose-100 text-rose-800']
};
const SW_WD = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const swDm = d => d ? `${d.slice(8)}/${d.slice(5, 7)}` : '';
const swLabel = d => `${SW_WD[new Date(d + 'T00:00:00').getDay()]} ${swDm(d)}`;
const swAddDays = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return fmtInput(d); };
const swWork = l => (l || []).filter(s => SHIFT_TYPES[s]);
const swCredit = l => (l || []).reduce((a, s) => a + (SHIFT_TYPES[s] ? SHIFT_TYPES[s].credit : 0), 0);
const swShow = l => (l && l.length ? l.join(', ') : '-');
const swDates = (schedules, empId) => Array.from({ length: 45 }, (_, i) => swAddDays(fmtInput(new Date()), i + 1)).filter(d => swWork(shiftsOf(schedules, d, empId)).length);
const swPendingCount = (swaps, employees, role, user) => (swaps || []).filter(s => s.status === 'pending' && (role === 'admin' || employees[s.empId]?.dept === user.dept) && s.empId !== user.id && s.friendId !== user.id).length;

// a ให้เวรวัน dA แก่ b และรับเวรของ b วัน dB (dA = dB คือสลับเวรกันในวันเดียวกัน) — กติกาเดียวกับ Code.gs
const swPlan = (schedules, a, b, dA, dB) => {
  const g = (d, e) => shiftsOf(schedules, d, e), sa = g(dA, a), sb = g(dB, b);
  if (!swWork(sa).length) return { err: `คุณไม่มีเวรทำงานในวันที่ ${swDm(dA)}` };
  if (!swWork(sb).length) return { err: `เพื่อนไม่มีเวรทำงานในวันที่ ${swDm(dB)}` };
  for (const [e, d] of [[a, dA], [b, dB], [a, dB], [b, dA]]) if (g(d, e).some(s => !SHIFT_TYPES[s] && s !== 'Off')) return { err: `มีรายการลาในวันที่ ${swDm(d)}` };
  let changes;
  if (dA !== dB) {
    if (swWork(g(dB, a)).length) return { err: `ผู้ขอมีเวรทำงานอยู่แล้วในวันที่ ${swDm(dB)}` };
    if (swWork(g(dA, b)).length) return { err: `เพื่อนมีเวรทำงานอยู่แล้วในวันที่ ${swDm(dA)}` };
    changes = [{ emp: a, date: dA, from: sa, to: ['Off'] }, { emp: a, date: dB, from: g(dB, a), to: sb }, { emp: b, date: dA, from: g(dA, b), to: sa }, { emp: b, date: dB, from: sb, to: ['Off'] }];
  } else {
    if (sa.join() === sb.join()) return { err: 'เวรของทั้งสองคนเหมือนกัน ไม่ต้องสลับ' };
    changes = [{ emp: a, date: dA, from: sa, to: sb }, { emp: b, date: dA, from: sb, to: sa }];
  }
  const re = swRun(schedules, changes);
  if (re) return { err: re, changes };
  return { changes, sa, sb };
};

const swRun = (schedules, changes) => {
  const g = (d, e) => shiftsOf(schedules, d, e), ov = {};
  changes.forEach(c => { ov[c.date + '_' + c.emp] = c.to; });
  const at = (e, d) => ov[d + '_' + e] || g(d, e);
  for (const c of changes) {
    if (!swWork(c.to).length) continue;
    let n = 1;
    for (let k = 1; k <= 8 && swWork(at(c.emp, swAddDays(c.date, -k))).length; k++) n++;
    for (let k = 1; k <= 8 && swWork(at(c.emp, swAddDays(c.date, k))).length; k++) n++;
    if (n > 6) return `หลังเปลี่ยนจะทำงานติดกัน ${n} วัน (เกิน 6 วัน)`;
  }
  return '';
};
// ย้ายวันหยุดของตัวเอง: วัน dA (มีเวรทำงาน) -> Off, วัน dB (วันหยุด) -> ทำเวรเดิมของวัน dA
const swMovePlan = (schedules, a, dA, dB) => {
  const g = (d, e) => shiftsOf(schedules, d, e), sa = g(dA, a), sb = g(dB, a);
  if (dA === dB) return { err: 'เลือกวันที่ไม่ใช่วันเดียวกัน' };
  if (!swWork(sa).length) return { err: `ไม่มีเวรทำงานในวันที่ ${swDm(dA)}` };
  if (sa.some(s => !SHIFT_TYPES[s] && s !== 'Off')) return { err: `มีรายการลาในวันที่ ${swDm(dA)}` };
  if (!sb.length || sb.some(s => s !== 'Off')) return { err: `วันที่ ${swDm(dB)} ไม่ใช่วันหยุดในตารางเวร` };
  const changes = [{ emp: a, date: dA, from: sa, to: ['Off'] }, { emp: a, date: dB, from: sb, to: sa }];
  const re = swRun(schedules, changes);
  return re ? { err: re, changes } : { changes, sa, sb };
};
// ยกเวรให้เพื่อน: ทั้งกะ หรือแยกจากกะควบ (ชบ -> ยก บ เหลือ ช) — กติกาเดียวกับ Code.gs
const SHIFT_SPLIT = { 'ชบ': ['ช', 'บ'], 'ชบ7': ['ช7', 'บ15'] };
const GIVE_MIN_HOURS = 2;
const swMin = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const swSpan = (code, off) => { const t = SHIFT_TYPES[code]; if (!t) return null; const a = swMin(t.start); let b = swMin(t.end); if (b <= a) b += 1440; return [a + off * 1440, b + off * 1440]; };

const swGiveDates = (schedules, empId) => Array.from({ length: 46 }, (_, i) => swAddDays(fmtInput(new Date()), i)).filter(d => swWork(shiftsOf(schedules, d, empId)).length);
// ตัวเลือกกะที่ยกได้ของวันนั้น: [{ part, w (กะเดิม), rest (ที่เหลือ) }]
const swGiveParts = l => swWork(l).flatMap(w => [{ part: w, w, rest: [] }, ...(SHIFT_SPLIT[w] || []).map(x => ({ part: x, w, rest: SHIFT_SPLIT[w].filter(y => y !== x) }))]);
const swGivePlan = (schedules, a, b, d, part, nameOf) => {
  const g = (dd, e) => shiftsOf(schedules, dd, e), sa = g(d, a), sb = g(d, b), lv = l => l.filter(x => !SHIFT_TYPES[x] && x !== 'Off');
  if (!SHIFT_TYPES[part]) return { err: 'เลือกกะที่จะยก' };
  if (lv(sa).length) return { err: `คุณมีรายการลาในวันที่ ${swDm(d)}` };
  if (lv(sb).length) return { err: `เพื่อนมีรายการลาในวันที่ ${swDm(d)}` };
  const opt = swGiveParts(sa).find(o => o.part === part);
  if (!opt) return { err: `ไม่พบกะ ${part} ในเวรวันที่ ${swDm(d)}` };
  let aTo = []; sa.forEach(x => { if (x === opt.w) aTo.push(...opt.rest); else if (x !== 'Off') aTo.push(x); });
  if (!aTo.length) aTo = ['Off'];
  const p0 = swSpan(part, 0);
  for (const off of [-1, 0, 1]) for (const x of swWork(off ? g(swAddDays(d, off), b) : sb)) {
    const q = swSpan(x, off);
    if (q && p0[0] < q[1] && q[0] < p0[1]) return { err: `เพื่อนมีเวร ${x}${off ? ` วันที่ ${swDm(swAddDays(d, off))}` : ''} ชนกับเวลากะ ${part}` };
  }
  const bTo = sb.filter(x => x !== 'Off').concat(part).sort((x, y) => (swSpan(x, 0) || [0])[0] - (swSpan(y, 0) || [0])[0]);
  const changes = [{ emp: a, date: d, from: sa, to: aTo }, { emp: b, date: d, from: sb, to: bTo }];
  const re = swRun(schedules, [changes[1]]);
  return re ? { err: re, changes } : { changes, sa, sb, w: opt.w, rest: opt.rest };
};
const swOffDates = (schedules, empId) => Array.from({ length: 45 }, (_, i) => swAddDays(fmtInput(new Date()), i + 1)).filter(d => { const l = shiftsOf(schedules, d, empId); return l.length > 0 && l.every(s => s === 'Off'); });

// ---------- ฉบับร่าง / ส่งตารางเวร (กติกาเดียวกับ Code.gs: เริ่มใช้ตั้งแต่เดือน draftFrom) ----------
const ymTh = ym => `${THAI_MONTHS[+ym.slice(5, 7) - 1]} ${+ym.slice(0, 4) + 543}`;
const pubInfo = (settings, dept, ym) => {
  const from = settings?.draftFrom || '2027-01';
  if (!ym || ym < from || !dept || dept === 'ADMIN') return { st: 'legacy' };
  const v = settings?.publish?.[dept + '|' + ym];
  return v && (v.s === 'published' || v.s === 'reopened') ? { ...v, st: v.s } : { st: 'draft' };
};
// พนักงานเห็นตารางเวรของเดือนที่ส่งแล้ว (หรือเดือนแบบเดิม) / เดือนที่ปลดล็อกกลับมาแก้ ยังเห็นถ้าเดือนเริ่มแล้ว (ใช้ลงเวลา)
const schedVisible = (settings, dept, ym) => { const p = pubInfo(settings, dept, ym); return p.st === 'legacy' || p.st === 'published' || (p.st === 'reopened' && ym <= fmtInput(new Date()).slice(0, 7)); };
const visibleSchedules = (schedules, employees, settings) => {
  const out = {};
  Object.keys(schedules || {}).forEach(d => { const o = {}, day = schedules[d]; Object.keys(day).forEach(e => { if (schedVisible(settings, employees[e]?.dept, d.slice(0, 7))) o[e] = day[e]; }); out[d] = o; });
  return out;
};
// แจ้งเตือนตารางที่ยังไม่ส่ง: เดือนนี้ (ด่วน) + เดือนหน้า (ตั้งแต่วันที่ PUB_WARN_DAY)
const PUB_WARN_DAY = 20;
const pubAlerts = (settings, employees, depts) => {
  const t = new Date(), cur = fmtInput(t).slice(0, 7), nx = fmtInput(new Date(t.getFullYear(), t.getMonth() + 1, 1)).slice(0, 7);
  const months = [cur, ...(t.getDate() >= PUB_WARN_DAY ? [nx] : [])], out = [];
  depts.forEach(dept => months.forEach(ym => { const p = pubInfo(settings, dept, ym); if (p.st === 'draft' || p.st === 'reopened') out.push({ dept, ym, st: p.st, urgent: ym === cur }); }));
  return out;
};
const PubAlert = ({ user, role, settings, employees, onGo }) => {

      <p className="font-head font-semibold flex items-center gap-2"><i className="fa-solid fa-bell" aria-hidden="true"></i>{role === 'admin' ? `ตารางเวรที่ยังไม่ส่ง ${list.length} รายการ` : 'ยังไม่ได้ส่งตารางเวร'}</p>

          <span className="min-w-0">{role === 'admin' ? `แผนก${x.dept} · ` : ''}{ymTh(x.ym)}{x.st === 'reopened' ? ' (ปลดล็อกแก้ไข)' : ''}{x.urgent ? ' · เริ่มเดือนแล้ว พนักงานยังไม่เห็นเวร' : ''}</span>
          {onGo && <button onClick={() => onGo(x)} className="shrink-0 h-9 px-3 rounded-full bg-white border border-current/20 text-xs font-bold">ไปที่ตารางเวร</button>}
        </div>))}

    </div>);

// ---------- เพิ่มเวร (OT / เสริมเวร) และ แก้ไข / ลบเวร — กติกาเดียวกับ Code.gs ----------
const ADD_KINDS = ['OT', 'เสริมเวร'];
// OT เป็นช่วงเวลานอกเหนือกะ เช่น "16:00-17:00" (เก็บในคำขอ ไม่เปลี่ยนช่องในตารางเวร) — กติกาเดียวกับ Code.gs
const OT_RE = /^([01]\d|2[0-3]):([0-5]\d)-([01]\d|2[0-4]):([0-5]\d)$/;
const otSpan = (part, off = 0) => { const m = OT_RE.exec(part || ''); if (!m) return null; const st = +m[1] * 60 + +m[2]; let en = +m[3] * 60 + +m[4]; if (en <= st) en += 1440; return [st + off * 1440, en + off * 1440]; };
const otHours = part => { const sp = otSpan(part) || swSpan(part, 0); return sp ? (sp[1] - sp[0]) / 60 : 0; };   // ชั่วโมงของช่วง OT หรือของกะ
const otLabel = part => OT_RE.test(part || '') ? part.replace(/:/g, '.').replace('-', ' - ') : part;
const swAdjPlan = (schedules, e, d, type, val) => {
  const g = dd => shiftsOf(schedules, dd, e), cur = g(d);
  if (cur.some(x => !SHIFT_TYPES[x] && x !== 'Off')) return { err: `มีรายการลาในวันที่ ${swDm(d)} (แก้ไขผ่านระบบลา)` };
  let to;
  const custom = type === 'add' && OT_RE.test(val || '');
  if (custom) { const sp = otSpan(val), dur = sp[1] - sp[0]; if (dur < 15 || dur > 480) return { err: 'ช่วงเวลา OT ต้องอยู่ระหว่าง 15 นาที ถึง 8 ชั่วโมง' }; to = [...cur]; }
  else if (type === 'add') {
    if (!SHIFT_TYPES[val]) return { err: 'เลือกกะที่จะเพิ่ม' };
    if (swWork(cur).includes(val)) return { err: `มีกะ ${val} ในวันนั้นอยู่แล้ว` };
    to = [...swWork(cur), val].sort((x, y) => (swSpan(x, 0) || [0])[0] - (swSpan(y, 0) || [0])[0]);
  } else {
    if (val !== 'Off' && !SHIFT_TYPES[val]) return { err: 'เลือกเวรใหม่ หรือ Off (ลบเวร)' };
    to = [val];
    if (to.join() === cur.join()) return { err: 'เวรใหม่เหมือนเวรเดิม' };
    if (val === 'Off' && !swWork(cur).length) return { err: 'วันนั้นไม่มีเวรทำงานให้ลบ' };
  }
  const p0 = custom ? otSpan(val) : swSpan(val, 0);
  if (p0) for (const off of [-1, 0, 1]) for (const x of (off ? swWork(g(swAddDays(d, off))) : type === 'add' ? swWork(cur) : [])) {
    const q = swSpan(x, off);
    if (q && p0[0] < q[1] && q[0] < p0[1]) return { err: `มีเวร ${x}${off ? ` วันที่ ${swDm(swAddDays(d, off))}` : ''} ชนกับเวลา${custom ? ' OT ' : 'กะ '}${otLabel(val)}` };
  }
  return { sa: cur, to, custom, changes: custom ? [] : [{ emp: e, date: d, from: cur, to }] };
};
const swAdjChecks = (schedules, records, e, d, type, val, forApproval, onBehalf) => {
  const plan = swAdjPlan(schedules, e, d, type, val), items = [], now = Date.now(), cst = type === 'add' && OT_RE.test(val || '');

// ================= App =================
function App() {
  const [user, setUser] = useState(null), [tab, setTab] = useState('home'), [imgErr, setImgErr] = useState(false), [formOpen, setFormOpen] = useState(false);
  const [now, setNow] = useState(new Date()), [loading, setLoading] = useState(true), [syncedAt, setSyncedAt] = useState(null), [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'pink'), [themeOpen, setThemeOpen] = useState(false), [headArt, setHeadArt] = useState(() => { try { return localStorage.getItem('rt_head') || 'city'; } catch (e) { return 'city'; } });
  const [records, setRecords] = useState([]), [employees, setEmployees] = useState({}), [schedules, setSchedules] = useState({}), [swaps, setSwaps] = useState([]);
  const [settings, setSettings] = useState({ standardWorkDays: {} });
  const [mgrStart, setMgrStart] = useState(null);   // เปิดหน้าจัดการที่แท็บตารางเวร (จากแถบแจ้งเตือน)
  const pubSched = useMemo(() => visibleSchedules(schedules, employees, settings), [schedules, employees, settings]);   // ตารางที่พนักงานเห็น (ไม่รวมฉบับร่าง)

  // อัปเดตเฉพาะตอนนาทีเปลี่ยน (ค่าเดิม = ไม่ render ซ้ำ)
  useEffect(() => {
    const t = setInterval(() => setNow(p => { const n = new Date(); return n.getMinutes() === p.getMinutes() ? p : n; }), 1000);
    return () => clearInterval(t);
  }, []);

  const verRef = useRef(null);
  const applyData = d => {
    setEmployees(d.employees || {}); setRecords(d.records || []); setSchedules(d.schedules || {}); setSwaps(d.swaps || []);
    if (d.settings) setSettings(d.settings);
    verRef.current = d.version;
    setSyncedAt(new Date());
  };
  const reload = async () => { const r = await sendToGoogleSheet('getInitialData'); if (r?.status === 'success') applyData(r.data); };
  const quiet = async action => { // เรียกแบบเงียบ ไม่เด้งแจ้งเตือนเมื่อเน็ตสะดุด
    try {
      const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload: {} }) });
      return await r.json();
    } catch (e) { return null; }
  };
  const sync = async () => {
    if (pendingWrites > 0 || syncing) return;   // กำลังบันทึกอยู่ ไม่ดึงข้อมูลมาทับ
    syncing = true;
    const seq = writeSeq;
    try {
      const v = await quiet('getVersion');
      if (v?.status === 'success' && v.version !== verRef.current) {
        const r = await quiet('getInitialData');
        // ถ้ามีการบันทึกเกิดขึ้นระหว่างดึง ให้ทิ้งผลนี้ (รอบถัดไปจะดึงใหม่)
        if (r?.status === 'success' && pendingWrites === 0 && seq === writeSeq) applyData(r.data);
      } else if (v?.status === 'success') setSyncedAt(new Date());   // ข้อมูลเป็นปัจจุบันแล้ว
    } finally { syncing = false; }
  };

  useEffect(() => {
    (async () => {
      const res = await sendToGoogleSheet('getInitialData');
      if (res?.status === 'success') applyData(res.data);
      setLoading(false);
    })();
  }, []);

  // เรียลไทม์แบบ polling: ตรวจเวอร์ชันทุก POLL_MS และทันทีที่กลับมาเปิดหน้า
  useEffect(() => {
    if (!user) return;
    const tick = () => { if (!document.hidden) sync(); };
    const t = setInterval(tick, POLL_MS);
    document.addEventListener('visibilitychange', tick);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', tick); };
  }, [user]);

  useEffect(() => { loadFaceLite().catch(() => {}); }, []); // โหลดตัวตรวจใบหน้าล่วงหน้า

  if (loading) return (
    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50">
      <div className="w-10 h-10 border-4 border-gray-200 border-t-primary rounded-full animate-spin mb-4"></div>
      <h2 className="text-gray-600 font-medium">กำลังโหลดข้อมูล...</h2>
    </div>
  );
  if (!user) return <LoginView employees={employees} onLogin={u => { setUser(u); setImgErr(false); }} />;

function ClockInModule({ user, now, records, setRecords, schedules, onDone, onBack, avatar }) {
  const [shift, setShift] = useState(''), [valid, setValid] = useState([]), [loc, setLoc] = useState('checking'), [pos, setPos] = useState(null), [gps, setGps] = useState(null);
  const [cam, setCam] = useState(false), [scanning, setScanning] = useState(false), [result, setResult] = useState(null), [err, setErr] = useState('');
  const vref = useCamera(cam && !result && loc === 'ok', () => { setErr('ไม่สามารถเปิดกล้องได้ โปรดตรวจสอบการอนุญาต'); setCam(false); });
  const already = shift && records.some(r => r.empId === user.id && r.date === resolveTarget(now, schedules, user.id, shift).date && r.shiftId === shift);
  const canGo = cam && loc === 'ok' && valid.length > 0 && !already;
  const { found: faceOk, manual, ready, dbg, prog } = useFaceFrame(vref, canGo && !scanning && !result, () => handleClockIn());
  // เปิดกล้องอัตโนมัติเมื่อพิกัดผ่านและมีกะเดียว (ถ้ามีหลายกะ ให้เลือกกะก่อนแล้วกดเปิดกล้อง)
  useEffect(() => { if (loc === 'ok' && valid.length === 1 && !already) setCam(true); }, [loc, valid.length, already]);

  useEffect(() => {
    const today = fmtInput(now);
    const active = records.find(r => r.empId === user.id && !r.timeOut && (r.date === today || (now.getHours() <= 8 && r.date === fmtInput(new Date(now.getTime() - 864e5)))));
    if (active) { setErr(`ค้างลงเวลาออกกะ "${SHIFT_TYPES[active.shiftId]?.label || active.shiftId}"`); setLoc('error'); return; }
    const { date, shifts } = resolveTarget(now, schedules, user.id);
    const done = records.filter(r => r.empId === user.id && r.date === date).map(r => r.shiftId);
    const ok = shifts.filter(s => s && !NON_WORK.includes(s) && !done.includes(s));
    setValid(ok);
    if (ok.length) { setShift(ok[0]); checkLocation(); }
    else { setShift(''); setErr(shifts.length && done.length ? 'ลงเวลาครบทุกกะของวันนี้แล้ว' : 'ไม่พบตารางเวรของคุณในระบบ'); setLoc('error'); }
  }, []);

  const checkLocation = () => {
    setLoc('checking'); setErr('');
    if (!navigator.geolocation) { setErr('เบราว์เซอร์ไม่รองรับ GPS'); setLoc('error'); return; }
    const t = setTimeout(() => { setErr('GPS ไม่ตอบสนอง ลองสลับเน็ตหรือรีเฟรชหน้าเว็บ'); setLoc('error'); }, 15000);
    navigator.geolocation.getCurrentPosition(

        setGps({ d: Math.round(d), acc: Math.round(accuracy || 0) });
        if (d <= ALLOWED_RADIUS) { setLoc('ok'); setErr(''); } else { setErr(`อยู่นอกพื้นที่ (${Math.round(d)}ม.)`); setLoc('error'); }
      },

    if (already) { setErr('ไม่อนุญาต: คุณได้ลงเวลาสำหรับกะนี้ไปแล้ว'); setCam(false); return; }
    setErr(''); setScanning(true);
    const photoBase64 = captureImage(vref.current);
    if (!photoBase64) { setErr('จับภาพล้มเหลว รอให้กล้องชัดเจนก่อนกดสแกน'); setScanning(false); return; }
    const sd = SHIFT_TYPES[shift], [h, m] = sd.start.split(':').map(Number);
    const actual = now.getHours() * 60 + now.getMinutes(), deadline = h * 60 + m + 5;
    const tgt = resolveTarget(now, schedules, user.id, shift);
    // วันที่ช่องเวรมี "ลาชั่วโมง" ไม่นับสาย (ระบบไม่ทราบช่วงเวลาที่ลา)
    let dl = deadline;
    if (tgt.shifts.includes('ลาชั่วโมง')) {
      // ไม่ทราบเวลาลา หรือ ลาครอบเวลาเริ่มกะ = ไม่นับสาย / ลาช่วงอื่น (เช่น ท้ายกะ) = นับสายตามปกติ
      const lt = schedules[tgt.date]?.[user.id]?.leaveTime || '', tm = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
      const cover = lt.split(';').filter(Boolean).map(x => x.split('-').map(tm)).find(([a, b]) => a <= h * 60 + m && b > h * 60 + m);
      dl = !lt || cover ? Infinity : deadline;
    }
    const isLate = actual > dl && actual < dl + 720;
    const rec = { id: Date.now().toString(), date: tgt.date, empId: user.id, shiftId: shift, timeIn: formatTime24(now), timeOut: null,
      isLate, lateMinutes: isLate ? actual - dl : 0, credit: sd.credit, lat: pos?.lat, lon: pos?.lon, photoBase64 };
    const res = await sendToGoogleSheet('clockIn', rec, 3);
    if (res?.status === 'success') { setRecords([...records, rec]); setResult({ ...rec, shiftName: sd.label }); }
    else if (res?.status === 'error') Swal.fire({ icon: 'error', text: res.message, confirmButtonColor: themeHex('p') });
    setScanning(false); setCam(false);
  };

  if (result) return <ResultModal tone="primary" icon="fa-check" title="บันทึกเข้างานสำเร็จ" time={result.timeIn} shiftName={result.shiftName} late={result.isLate ? result.lateMinutes : 0} onDone={onDone} />;

  const status = loc === 'ok' ? 'อยู่ในพื้นที่ รพ.' : loc === 'checking' ? 'กำลังตรวจพิกัด' : gps && gps.d > ALLOWED_RADIUS ? 'อยู่นอกพื้นที่ รพ.' : 'ลงเวลาไม่ได้';
  const detail = loc === 'ok' ? `ห่างจุดลงเวลา ${gps?.d ?? '-'} ม.${gps?.acc ? ` · GPS ±${gps.acc} ม.` : ''}` : loc === 'checking' ? 'รอสัญญาณ GPS...' : err;
  return (
    <>
      <ClockHero title="ลงเวลาเข้า" onBack={onBack} avatar={avatar} now={now} status={status} tone={loc === 'ok' ? 'ok' : loc === 'checking' ? 'wait' : 'bad'} detail={detail} />
      <Sheet tight>
        <SheetHandle />
        {loc !== 'error' && <ErrorBox msg={err} />}
        {valid.length > 1 && <div>
          <label className={LABEL}>เลือกกะที่จะลงเวลา</label>
          <select value={shift} onChange={e => setShift(e.target.value)} className={`${FIELD} focus:border-primary`}>{valid.map(k => <option key={k} value={k}>{SHIFT_TYPES[k]?.label || k}</option>)}</select>
        </div>}
        {shift ? <ShiftPills code={shift} /> : <div className="w-full p-3.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-500 text-sm font-medium text-center">ไม่พบตารางเวรที่ลงได้</div>}
        <CameraBox active={cam} vref={vref} onOpen={() => setCam(true)} disabled={loc !== 'ok' || !valid.length || already} label="เปิดกล้องสแกนใบหน้า" found={faceOk} ready={ready} dbg={dbg} prog={prog} saving={scanning} />
        {cam && <ScanHint scanning={scanning} />}
        {loc === 'error' && gps && <button onClick={checkLocation} className="mx-auto flex items-center gap-2 h-11 px-5 rounded-full border border-slate-300 text-slate-600 text-sm font-bold"><i className="fa-solid fa-location-crosshairs"></i>ตรวจพิกัดอีกครั้ง</button>}
        {manual && canGo && !scanning && <ManualBtn onClick={handleClockIn} />}
      </Sheet>
    </>
  );
}

function ClockOutModule({ user, now, records, setRecords, onDone, onBack, avatar }) {
  const [outDate, setOutDate] = useState(fmtInput(now)), [found, setFound] = useState(null), [err, setErr] = useState('');
  const [cam, setCam] = useState(false), [scanning, setScanning] = useState(false), [warn, setWarn] = useState(false), [ok, setOk] = useState(null);
  const vref = useCamera(cam && !ok, () => { setErr('ไม่สามารถเข้าถึงกล้องได้'); setCam(false); });
  const { found: faceOk, manual, ready, dbg, prog } = useFaceFrame(vref, cam && !ok && !scanning && !warn && !!found, () => attempt());
  useEffect(() => { if (found) setCam(true); }, [found]);   // เปิดกล้องอัตโนมัติเมื่อพบประวัติเข้างาน

  const search = date => {
    setErr(''); setFound(null); setCam(false);
    const r = records.find(x => x.empId === user.id && x.date === date && !x.timeOut);
    if (!r) setErr('ไม่พบประวัติค้างออกของวันที่เลือก'); else setFound(r);
  };
  useEffect(() => {
    // ถ้าวันนี้ไม่มีรายการค้างออก แต่เมื่อวานมี (เช่น เวรดึก) ให้เลือกวันนั้นให้เลย
    const y = fmtInput(new Date(now.getTime() - 864e5));
    const open = records.filter(r => r.empId === user.id && !r.timeOut && (r.date === outDate || r.date === y)).sort((a, b) => b.date.localeCompare(a.date))[0];
    if (open && open.date !== outDate) setOutDate(open.date);
    search(open ? open.date : outDate);
  }, []);

  const attempt = () => {
    if (!cam) return;
    const sd = SHIFT_TYPES[found.shiftId], [eh, em] = (sd.end === '24:00' ? '23:59' : sd.end).split(':').map(Number), sh = +sd.start.split(':')[0];
    const end = new Date(now); end.setHours(eh, em, 0, 0);
    if (eh < sh && now.getHours() >= 12) end.setDate(end.getDate() + 1);
    now < end ? setWarn(true) : process();
  };

  const process = async () => {
    setWarn(false); setScanning(true); setErr('');
    const photoBase64 = captureImage(vref.current);
    if (!photoBase64) { setScanning(false); return; }
    const timeOut = formatTime24(now);
    const res = await sendToGoogleSheet('clockOut', { id: found.id, timeOut, photoBase64 }, 3);
    if (res?.status === 'success') { setRecords(records.map(r => r.id === found.id ? { ...r, timeOut } : r)); setOk({ timeOut, shiftName: SHIFT_TYPES[found.shiftId]?.label }); }
    else if (res?.status === 'error') Swal.fire({ icon: 'error', text: res.message, confirmButtonColor: themeHex('s') });
    setScanning(false); setCam(false);
  };

  if (ok) return <ResultModal tone="secondary" icon="fa-arrow-right-from-bracket" title="บันทึกออกงานสำเร็จ" time={ok.timeOut} shiftName={ok.shiftName} onDone={onDone} />;

  return (
    <>
      <ClockHero title="ลงเวลาออก" onBack={onBack} avatar={avatar} now={now} status={found ? 'พบประวัติเข้างาน' : 'ยังไม่พบประวัติเข้างาน'} tone={found ? 'ok' : 'bad'}
        detail={found ? `เข้างานเมื่อ ${displaySafeTime(found.timeIn)} · ${formatDisplayDate(found.date)}` : (err || 'เลือกวันที่เข้างานด้านล่าง')} />
      <Sheet tight>
        <SheetHandle />
        <div>
          <label className={LABEL} htmlFor="out-date">วันที่เข้างาน</label>
          <input id="out-date" type="date" value={outDate} onChange={e => { setOutDate(e.target.value); search(e.target.value); }} className={`${FIELD} min-w-0 max-w-full block appearance-none focus:border-secondary`} />
        </div>
        {!found ? <div className="text-center py-8 bg-slate-50 rounded-xl border border-slate-200 text-slate-500 text-sm font-medium">ไม่พบประวัติเข้างานของวันที่เลือก</div> : (<>
          <ShiftPills code={found.shiftId} note={`เข้า ${displaySafeTime(found.timeIn)}`} />
          <CameraBox active={cam} vref={vref} onOpen={() => setCam(true)} label="เปิดกล้องสแกนหน้า" found={faceOk} ready={ready} dbg={dbg} prog={prog} saving={scanning} />
          {cam && <ScanHint scanning={scanning} />}
          {warn ? (
            <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-center shadow-sm">
              <p className="text-amber-800 mb-4 text-sm font-bold">ออกก่อนเวลาเลิกกะ ยืนยันหรือไม่?</p>
              <div className="flex gap-2">
                <button onClick={process} className="flex-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg py-2.5 text-sm font-bold transition-colors">ยืนยัน</button>
                <button onClick={() => setWarn(false)} className="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-lg py-2.5 text-sm font-bold transition-colors">ยกเลิก</button>
              </div>
            </div>
          ) : manual && cam && !scanning && <ManualBtn onClick={attempt} />}
        </>)}
      </Sheet>
    </>
  );
}

// เครดิตของแต่ละวันในเดือน: วันที่ผ่านมาใช้เครดิตจากการลงเวลาจริง (+ลาที่ได้เครดิต) / วันนี้-อนาคตใช้เวรในตาราง
const monthCredits = (y, m, empId, records, schedules, today) => {
  const out = [];
  for (let d = 1, n = new Date(y, m, 0).getDate(); d <= n; d++) {
    const ds = ymd(y, m, d), recs = records.filter(r => r.empId === empId && r.date === ds), sched = shiftsOf(schedules, ds, empId), worked = recs.map(r => r.shiftId);
    let c = recs.reduce((a, r) => a + (Number(r.credit) || 0), 0);
    sched.filter(s => !worked.includes(s)).forEach(s => { c += ds >= today ? creditOf(s) : (PAID.includes(s) ? 1 : 0); });
    out.push({ ds, d, c, recs, sched });
  }
  return out;
};

);

function MyHistoryView({ user, records, schedules, settings, now }) {
  const [month, setMonth] = useState(`${now.getFullYear()}-${pad(now.getMonth() + 1)}`);
  const mine = records.filter(r => r.empId === user.id && r.date.startsWith(month)).sort((a, b) => b.date.localeCompare(a.date) || b.timeIn.localeCompare(a.timeIn));
  const late = mine.filter(r => r.isLate).length, lateMin = mine.reduce((a, r) => a + (r.isLate ? Number(r.lateMinutes) || 0 : 0), 0);

  // สรุปเดือน: เครดิตรวม (วิธีเดียวกับหน้าสรุป OT ของหัวหน้า), วันทำงาน, พักร้อน, ลา, OT
  const [y, m] = month.split('-').map(Number), today = fmtInput(now), workDays = parseInt(settings?.standardWorkDays?.[month]) || 22;
  let credit = 0, vac = 0, leave = 0, hourly = 0;
  for (let d = 1, n = new Date(y, m, 0).getDate(); d <= n; d++) {
    const ds = ymd(y, m, d), recs = mine.filter(r => r.date === ds), sched = shiftsOf(schedules, ds, user.id), worked = recs.map(r => r.shiftId);
    credit += recs.reduce((a, r) => a + (r.credit || 0), 0);
    if (sched.some(s => s === 'Vac' || s === 'พักร้อน')) vac++;
    if (sched.some(s => s === 'ลา' || s === 'ป่วย')) leave++;
    if (sched.includes('ลาชั่วโมง')) hourly++;
    sched.filter(s => !worked.includes(s)).forEach(s => { credit += ds >= today ? creditOf(s) : (PAID.includes(s) ? 1 : 0); });
  }
  const f = n => +n.toFixed(3), ot = credit - workDays;
  const daysWorked = new Set(mine.map(r => r.date)).size, onTimeDays = new Set(mine.filter(r => !r.isLate).map(r => r.date)).size;
  // กราฟแท่ง: ชั่วโมงทำงานรายวัน (เครดิต × 8) ของเดือนที่เลือก
  const nDays = new Date(y, m, 0).getDate(), hrs = Array.from({ length: nDays }, (_, i) => mine.filter(r => r.date === ymd(y, m, i + 1)).reduce((a, r) => a + (Number(r.credit) || 0) * 8, 0));
  const totalH = hrs.reduce((a, b) => a + b, 0), maxH = Math.max(16, ...hrs), todayD = today.startsWith(month) ? now.getDate() : 0;

  return (
    <div className="max-w-md mx-auto space-y-3">
      <PageTitle sub={`แผนก${user.dept}`} title="ประวัติของฉัน" right={<input type="month" aria-label="เลือกเดือน" value={month} onChange={e => setMonth(e.target.value)} className="h-11 rounded-full bg-pink-50 text-pink-800 text-sm font-bold px-3 outline-none focus:ring-2 focus:ring-pink-300" />} />
      <Sheet>
      <SoftPanel>
        <div className="flex items-center justify-between gap-2">
          <p className="font-head font-semibold text-slate-800 flex items-center gap-2"><span className="w-8 h-8 rounded-[10px] bg-white text-primary flex items-center justify-center" aria-hidden="true"><i className="fa-regular fa-clock"></i></span>ชั่วโมงทำงาน {THAI_MONTHS[m - 1].slice(0, 3)}.</p>
          <p className="text-xl font-bold text-slate-900">{f(totalH)} ชม.</p>
        </div>
        <div className="mt-4 h-[130px] flex items-end gap-[3px]" role="img" aria-label={`ชั่วโมงทำงานรวม ${f(totalH)} ชั่วโมง`}>
          {hrs.map((h, i) => (
            <div key={i} className="flex-1 flex flex-col items-center gap-1 min-w-0" title={`${i + 1}: ${f(h)} ชม.`}>
              <span className={`block w-full max-w-[12px] rounded-[4px] ${!h ? 'bg-slate-200' : i + 1 === todayD ? 'bg-secondary' : h >= 16 ? 'bg-primary' : 'bg-pink-200'}`} style={{ height: h ? Math.max(6, h / maxH * 108) : 5 }}></span>
              <span className={`text-xs leading-none ${i + 1 === todayD ? 'font-bold text-pink-800' : 'text-slate-500'}`}>{(i + 1) % 5 === 0 || i === 0 ? i + 1 : ''}</span>
            </div>
          ))}
        </div>
        <div className="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-600">
          <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-[3px] bg-pink-200"></i>8 ชม.</span>
          <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-[3px] bg-primary"></i>16 ชม.ขึ้นไป</span>
          <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-[3px] bg-secondary"></i>วันนี้</span>
          <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-[3px] bg-slate-200"></i>ไม่มีบันทึก</span>
        </div>
      </SoftPanel>
      <h3 className="font-head text-[17px] font-semibold text-slate-800 pt-1">สรุปเดือนนี้</h3>
      <div className="grid grid-cols-2 gap-3">
        <StatCard icon="fa-circle-check" tone="text-emerald-700" title="มาตรงเวลา" value={`${onTimeDays} วัน`} sub={`จาก ${daysWorked} วันที่ลงเวลา`} />
        <StatCard icon="fa-clock" tone="text-amber-700" title="มาสาย" value={`${late} ครั้ง`} sub={`รวม ${lateMin} นาที`} />
        <StatCard icon="fa-bolt" title="เครดิตเวร" value={f(credit)} sub={`วันทำการ ${workDays} · รวมเวรล่วงหน้า`} />
        <StatCard icon="fa-chart-line" tone={ot > 0 ? 'text-secondary' : 'text-slate-500'} title="OT" value={`${ot > 0 ? '+' : ''}${f(ot)} วัน`} sub={`Vac ${vac} · ลา ${leave}${hourly ? ` · ลาชม. ${hourly}` : ''}`} />
      </div>
      <div className="space-y-2">
        {mine.map((r, i) => {
          const cur = shiftsOf(schedules, r.date, user.id), extra = cur.filter(s => s !== r.shiftId && NON_WORK.includes(s) && s !== 'Off');
          // เวรในตารางไม่ตรงกับที่ลงเวลาไว้ (เช่น สแกน ชบ แล้วถูกเปลี่ยนเป็น ช)
          const warn = !cur.includes(r.shiftId) && (cur.length ? `ตารางเวรวันนี้เปลี่ยนเป็น ${cur.join(', ')} แต่ลงเวลาไว้เป็น ${r.shiftId}` : `ไม่พบเวรของวันนี้ในตารางเวร (ลงเวลาไว้เป็น ${r.shiftId})`);
          const chip = r.isLate ? ['bg-amber-100 text-amber-800', `สาย ${r.lateMinutes} นาที`]
            : !r.timeOut ? (r.date < today ? ['bg-rose-100 text-rose-800', 'ลืมออก'] : ['bg-slate-100 text-slate-700', 'ยังไม่ออก'])
            : ['bg-emerald-100 text-emerald-800', 'ตรงเวลา'];
          return (
            <div key={r.id} className="py-2.5 px-3.5 rounded-2xl border-[1.5px] border-pink-100 bg-white">
              <div className="flex items-center justify-between gap-2">
                <div className="min-w-0">
                  <p className="text-[15px] font-semibold text-slate-800">{formatDisplayDate(r.date).slice(0, 5)} · {r.shiftId}{extra.length ? ', ' + extra.join(', ') : ''}</p>
                  <p className="text-[13px] text-slate-600">เข้า {displaySafeTime(r.timeIn)} · ออก {displaySafeTime(r.timeOut)} · เครดิต {r.credit}</p>
                </div>
                <span className={`text-xs font-bold rounded-full px-2.5 py-1 whitespace-nowrap ${chip[0]}`}>{chip[1]}</span>
              </div>
              {warn && <div className="mt-2 flex gap-2 items-start bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-2 text-[13px] font-semibold text-amber-800 leading-snug"><i className="fa-solid fa-triangle-exclamation mt-0.5"></i><span>{warn} · โปรดแจ้ง HR ตรวจสอบ</span></div>}
            </div>
          );
        })}
        {!mine.length && <div className="py-8 text-center text-slate-500 text-sm font-medium">ไม่พบประวัติในเดือนนี้</div>}
      </div>
      </Sheet>
    </div>
  );
}

<script type="text/babel" data-presets="react">
// ================= โมดูลจัดการ (ReportView) =================
const DEPARTMENTS = ["HR-IT","บัญชี","การเงินผู้ป่วย-สิทธิประโยชน์","OPD","NA OPD","IPD","NA IPD","ห้องยา","ห้องปฏิบัติการทางการแพทย์","เอกซเรย์","OR-LR","แม่บ้าน","ซักฟอก","หน่วยจ่ายกลาง","โภชนาการ","เปล-ยานยนต์","ช่าง","เวชระเบียน","ส่งเสริมสุขภาพ","ADMIN"];
const OPD_SH = ['ช6','ช7','ช716','ช917','ช21','ช','ชบ','ช9','บ','ด','บ4'], IPD_SH = ['ช','บ','ด','ชบ','บด'];
const DEPT_SHIFTS = {

  "ห้องยา": ['ช716','ช','บ','ด','ชบ','บด','ช20'], "ห้องปฏิบัติการทางการแพทย์": ['ช','ช7','ชบ7','บ15','ช20','ช719'], "เอกซเรย์": ['ช','ชบ','ช7','บ'],

};
const SHIFT_CATEGORY_MAP = { 'ด':{ด:1}, 'ช616':{ช:1,บ:.25}, 'ช618':{ช:1,บ:.5}, 'ช619':{ช:1,บ:.625}, 'ช6':{ช:1}, 'ช716':{ช:1,บ:.125}, 'ช719':{ช:1,บ:.5}, 'ช7':{ช:1}, 'ช21':{ช:1,บ:.75}, 'ชบ7':{ช:1,บ:1}, 'ช':{ช:1}, 'ชบ':{ช:1,บ:1}, 'ช20':{ช:1,บ:.5}, 'ช83':{ช:1}, 'ช9':{ช:1,บ:.5}, 'ช917':{ช:1}, 'บ15':{บ:1}, 'บ':{บ:1}, 'บด':{บ:1,ด:1}, 'บ4':{บ:.5} };
const PAID = ['Vac','พักร้อน','ป่วย','ลา'], LEAVE_LOCK = [...PAID, 'ลาชั่วโมง'], CAT_ORD = { 'ช':1, 'บ':2, 'ด':3 };

// พนักงานรายวัน / Parttime (คอลัมน์ Level) — นับเฉพาะเวรที่ลงตารางเวร ไม่เทียบวันทำการ ไม่มี OT ไม่นับวันลา

// จัดเวรตามกรอบกำลัง: เติมทีละวัน เริ่มจากกะที่หายาก (ดึก > บ > ช+บ > ช) หมุนเวียนคนที่ทำกะนั้นน้อยสุด (เสมอกันดูเครดิตน้อยสุด) ที่ไม่ผิดกติกา
function planFrame({ dates, emps, schedules, frame, maxRun, restNight }) {
  const cur = {}, credit = {}, cnt = {}, updates = [], short = [];
  const prevOf = d => fmtInput(new Date(new Date(d + 'T00:00:00').getTime() - 864e5));
  const getS = (id, d) => cur[id][d] || schedules[d]?.[id]?.shifts || [];
  emps.forEach(id => {
    cur[id] = {}; cnt[id] = {};
    dates.forEach(d => { cur[id][d] = [...(schedules[d]?.[id]?.shifts || [])]; });
    credit[id] = dates.reduce((a, d) => a + cur[id][d].reduce((b, s) => b + creditOf(s), 0), 0);
  });
  const before = { ...credit };
  const prio = s => { const c = SHIFT_CATEGORY_MAP[s] || {}; return c['ด'] ? 0 : c['ช'] ? (c['บ'] ? 2 : 3) : 1; };
  dates.forEach(d => {
    const wk = [0, 6].includes(new Date(d + 'T00:00:00').getDay());
    [...(wk ? frame.we : frame.wd)].sort((a, b) => prio(a.shift) - prio(b.shift)).forEach(({ shift, count }) => {
      const free = id => {
        if (cur[id][d].length) return false;                       // ช่องที่มีเวร/ลา/Off อยู่แล้ว ไม่แตะ
        let p = prevOf(d), run = 0;
        if (restNight && getS(id, p).some(s => s.includes('ด'))) return false; // พักหลังเวรดึก
        while (run < maxRun && getS(id, p).some(s => SHIFT_TYPES[s])) { run++; p = prevOf(p); }
        return run < maxRun;                                         // ทำงานติดกันไม่เกิน maxRun วัน
      };
      const pick = emps.filter(free).sort((a, b) => (cnt[a][shift] || 0) - (cnt[b][shift] || 0) || credit[a] - credit[b] || Math.random() - .5).slice(0, count);
      pick.forEach(id => { cur[id][d] = [shift]; credit[id] += creditOf(shift); cnt[id][shift] = (cnt[id][shift] || 0) + 1; updates.push({ date: d, empId: id, shifts: [shift] }); });
      if (pick.length < count) short.push({ date: d, shift, need: count, got: pick.length });
    });
  });
  return { updates, short, before, credit };
}

const SchedPrintSheet = ({ mode = 'schedules', showLate = false, rows, types, daysArray, dayStr, schedules, getDaily, my, mm, dept, matrixMonth, workDays, pub, user }) => {
  const sum = mode === 'summary';   // หน้าสรุป OT: แสดงกะที่ลงเวลาจริง
  const now = new Date(), wkd = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'], isWk = d => [0, 6].includes(new Date(my, mm - 1, d).getDay());
  const B = '1px solid #CBD5E1', cell = { border: B, textAlign: 'center', padding: '1px 0', fontSize: '8.5pt', lineHeight: 1.15 };
  const thS = { ...cell, background: '#F8FAFC', color: '#475569', fontWeight: 600 }, pink = '#FDF2F8';
  const cats = [...new Set(daysArray.flatMap(d => Object.keys(getDaily(d))))].sort(byCat);
  const num = n => Math.round(n * 100) / 100;
  const used = [...new Set(rows.flatMap(r => Object.keys(r.shiftCounts)))].filter(s => SHIFT_TYPES[s]).sort(byCat);
  const dt = d => d ? `${formatDisplayDate(d.slice(0, 10))} ${d.slice(11, 16)} น.` : '';
  const badge = sum ? null : pub.st === 'published' ? ['ส่งยืนยันแล้ว · ฉบับจริง', '#065F46', '#D1FAE5'] : pub.st === 'legacy' ? null : ['ฉบับร่าง · ยังไม่ส่ง', '#92400E', '#FEF3C7'];
  const info = [['แผนก', dept], ['เดือน', `${ymTh(matrixMonth)} (${daysArray.length} วัน)`], ['จำนวนพนักงาน', `${rows.length} คน`], ['วันทำการมาตรฐาน', `${workDays} วัน`],
    !sum && pub.st === 'published' ? ['ส่งตารางโดย', `${pub.name || pub.by} · ${dt(pub.at)}`] : ['ผู้พิมพ์', `${user.fname} ${user.lname}`],
    ['วันเวลาที่พิมพ์', `${now.getDate()} ${TH_MON_S[now.getMonth()]} ${now.getFullYear() + 543} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} น.`]];
  const shiftCell = (s, i) => {
    if (s === 'Off') return <div key={i} style={{ color: '#94A3B8', fontSize: '7.5pt' }}>Off</div>;
    if (!SHIFT_TYPES[s]) return <div key={i} style={{ display: 'inline-block', fontSize: '7pt', fontWeight: 700, color: '#92400E', background: '#FEF3C7', borderRadius: 3, padding: '0 1px', lineHeight: 1.15 }}>{s}</div>;
    return <div key={i} style={{ fontWeight: 700, color: /ด/.test(s) ? '#3730A3' : /บ/.test(s) ? '#9D174D' : '#0F172A' }}>{s}</div>;
  };
  // ช่องของหน้าสรุป: worked = ลงเวลาแล้ว, pending = ล่วงหน้า, leave = ลา/Off, absent = ขาด
  const sumCell = (e, i) => e.type === 'absent' ? <div key={i} style={{ fontWeight: 700, color: '#DC2626', textDecoration: 'line-through' }}>{e.shift}</div>
    : e.type === 'pending' && SHIFT_TYPES[e.shift] ? <div key={i} style={{ color: '#94A3B8', fontWeight: 600 }}>{e.shift}</div>
    : shiftCell(e.shift, i);
  return (
    <div className="sched-sheet" style={{ fontFamily: "'Sarabun', sans-serif", color: '#0F172A', background: '#fff' }}>

// ---------- สรุปเวรพนักงานรายวัน / Parttime (สำหรับทำค่าจ้าง) — นับตามเวรที่ลงตารางเวร ----------
const tempItems = (schedules, swaps, employees, records, dept, from, to) => {
  const ids = Object.keys(employees).filter(id => employees[id].dept === dept && isTempLevel(employees[id].level)), out = [], today = fmtInput(new Date());
  const act = (id, d, shift) => {
    const recs = records.filter(r => r.empId === id && r.date === d), mine = shift ? recs.filter(r => r.shiftId === shift) : recs;
    if (!mine.length && d >= today) return { t: d > today ? 'ยังไม่ถึงวัน' : 'วันนี้ ยังไม่ลงเวลา', c: '#94A3B8', ok: true };   // นับตามตาราง เหมือนหน้าสรุป
    return mine.length ? { t: `${(mine[0].timeIn || '').slice(0, 5) || '-'} – ${(mine[mine.length - 1].timeOut || '').slice(0, 5) || 'ยังไม่ออก'}`, c: '#0F172A', ok: true } : { t: 'ไม่พบการลงเวลา', c: '#DC2626', ok: false };
  };
  for (let d = from; d <= to; d = fmtInput(new Date(new Date(d + 'T00:00:00').getTime() + 864e5)))
    ids.forEach(id => (schedules[d]?.[id]?.shifts || []).filter(s => SHIFT_TYPES[s]).forEach(s => out.push({ id: id + d + s, empId: id, date: d, part: s, custom: false, h: otHours(s), credit: workCredit(s), act: act(id, d, s) })));
  swaps.filter(s => s.type === 'add' && s.status === 'approved' && OT_RE.test(s.part || '') && ids.includes(s.empId) && s.dateA >= from && s.dateA <= to)
    .forEach(s => out.push({ id: s.id, empId: s.empId, date: s.dateA, part: s.part, custom: true, h: otHours(s.part), credit: 0, act: act(s.empId, s.dateA, null) }));
  return out.sort((a, b) => (employees[a.empId]?.fname || '').localeCompare(employees[b.empId]?.fname || '') || a.empId.localeCompare(b.empId) || a.date.localeCompare(b.date));
};

// ---------- ปิดรอบจ่าย OT (จ่ายล่วงหน้าตามตารางเวร) + ส่วนต่างหลังปิดรอบ ----------
// สรุปเดือนของพนักงาน 1 คน — กติกาเดียวกับหน้าสรุป OT · วันที่ >= pendFrom ถือว่ายังไม่ถึง นับตามตารางเวร
const calcEmpMonth = (emp, empId, recs, schedules, ym, pendFrom) => {
  const [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate();
  const temp = isTempLevel(emp?.level), shiftsByDay = {}, shiftCounts = {};
  let credit = 0, late = 0;
  const add = s => { shiftCounts[s] = (shiftCounts[s] || 0) + 1; };
  for (let day = 1; day <= n; day++) {
    const ds = ymd(y, m, day), dayRecs = recs.filter(r => r.date === ds), sched = schedules[ds]?.[empId]?.shifts || [], ui = [];
    let absent = false;
    const worked = dayRecs.map(r => r.shiftId).filter(Boolean);
    worked.forEach(s => { add(s); ui.push({ shift: s, type: 'worked' }); });
    credit += temp ? worked.filter(s => sched.includes(s)).reduce((a, s) => a + workCredit(s), 0)   // รายวัน: นับตามเวรในตาราง (ที่มาทำจริง)
      : dayRecs.reduce((a, r) => a + (r.credit || 0), 0);
    late += dayRecs.reduce((a, r) => a + (r.isLate ? Number(r.lateMinutes) : 0), 0);
    sched.filter(s => s && !worked.includes(s)).forEach(s => {
      if (ds >= pendFrom) { add(s); credit += temp ? workCredit(s) : creditOf(s); ui.push({ shift: s, type: 'pending' }); }
      else if (LEAVE_LOCK.includes(s) || s === 'Off') { add(s); if (PAID.includes(s) && !temp) credit += 1; ui.push({ shift: s, type: 'leave' }); }
      else { add('ขาด'); absent = true; ui.push({ shift: s, type: 'absent' }); }
    });
    shiftsByDay[day] = { absent, ui };
  }
  return { shiftsByDay, credit, late, temp, shiftCounts };
};
const r2 = n => Math.round(n * 100) / 100;
const nextDs = ds => fmtInput(new Date(new Date(ds + 'T00:00:00').getTime() + 864e5));
const monthEndDs = ym => `${ym}-${String(new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate()).padStart(2, '0')}`;
const recsOfMonth = (records, ym) => { const m = {}; records.forEach(r => { if (r.date.startsWith(ym)) (m[r.empId] = m[r.empId] || []).push(r); }); return m; };
// วันที่เริ่มนับเป็น "ล่วงหน้า" ของรอบที่ปิด: วันถัดจากวันตัดรอบ (หรือวันที่กดปิดรอบ ถ้ากดก่อนวันตัดรอบ)
const payAheadFrom = (cut, at) => { const a = nextDs(cut), f = cut.slice(0, 7) + '-01'; let b = /^\d{4}-\d{2}-\d{2}/.test(at || '') ? at.slice(0, 10) : a; if (b < f) b = f; return b < a ? b : a; };

// ตัวเลขที่บันทึกตอนปิดรอบ: ทุกคน (ยกเว้น ADMIN) ที่มีเวร / ลงเวลาในเดือนนั้น
const payrollRows = (employees, records, schedules, ym, cut, workDays, today) => {
  const recBy = recsOfMonth(records, ym), from = payAheadFrom(cut, today), end = monthEndDs(ym);
  return Object.keys(employees).filter(id => employees[id].dept && employees[id].dept !== 'ADMIN').map(id => {
    const e = employees[id], c = calcEmpMonth(e, id, recBy[id] || [], schedules, ym, from), ahead = {};
    for (let d = from; d <= end; d = nextDs(d)) { const s = [...new Set([...(schedules[d]?.[id]?.shifts || []), ...(recBy[id] || []).filter(r => r.date === d).map(r => r.shiftId)].filter(Boolean))]; if (s.length) ahead[d] = s; }   // เวรที่จ่ายไป: ตามตาราง + ที่ลงเวลาแล้ว
    if (!(recBy[id] || []).length && !Object.keys(ahead).length && !c.credit) return null;
    return { empId: id, dept: e.dept, credit: r2(c.credit), workDays: c.temp ? 0 : workDays, ot: c.temp ? null : r2(c.credit - workDays), ahead };
  }).filter(Boolean);
};

// เทียบตัวเลขตอนปิดรอบ กับตัวเลขตามลงเวลาจริงตอนนี้ → เฉพาะคนที่ไม่ตรง
const payrollDiff = (snap, ym, employees, records, schedules, today, depts = null) => {
  if (!snap) return [];
  const recBy = recsOfMonth(records, ym), from = payAheadFrom(snap.cut, snap.at), end = monthEndDs(ym), out = [];
  const ids = new Set([...Object.keys(snap.rows || {}), ...Object.keys(employees).filter(id => employees[id].dept && employees[id].dept !== 'ADMIN')]);
  ids.forEach(id => {
    const e = employees[id], row = snap.rows?.[id], dept = e?.dept || row?.dept || '';
    if (depts && !depts.includes(dept)) return;
    if (!e) return;
    const live = calcEmpMonth(e, id, recBy[id] || [], schedules, ym, today);
    if (!row && !live.credit) return;
    const temp = live.temp, wd = row ? row.workDays : 0, notes = [];
    for (let d = from; d <= end; d = nextDs(d)) {
      const planned = row?.ahead?.[d] || [], ui = live.shiftsByDay[+d.slice(8)]?.ui || [], t = [];
      planned.forEach(s => { const u = ui.find(x => x.shift === s); if (!u) t.push({ t: `ลบเวร ${s}`, k: -1 }); else if (u.type === 'absent') t.push({ t: `ขาด ${s}`, k: -1 }); });
      ui.forEach(u => { if (planned.includes(u.shift) || u.type === 'absent') return; t.push(u.type === 'worked' ? { t: `ทำเพิ่ม ${u.shift}`, k: 1 } : u.type === 'pending' ? { t: `เพิ่มเวร ${u.shift}`, k: 1 } : { t: u.shift, k: 0 }); });
      if (t.length) notes.push({ d, t });
    }
    const credit = r2(live.credit), was = row ? row.credit : 0, diff = r2(credit - was);
    if (Math.abs(diff) < 0.005 && !notes.length && row) return;
    out.push({ empId: id, dept, temp, was, credit, diff, wasOt: row ? row.ot : null, ot: temp ? null : r2(credit - wd), notes, missing: !row });
  });
  return out.sort((a, b) => a.dept.localeCompare(b.dept) || (Math.abs(b.diff) - Math.abs(a.diff)) || a.empId.localeCompare(b.empId));
};
const payMoney = d => d.filter(x => Math.abs(x.diff) >= 0.005);   // คนที่ยอดเครดิตเปลี่ยน (กระทบเงิน)
const fmtDiff = n => (n > 0 ? '+' : '') + r2(n);

// เอกสารพิมพ์: รายงานส่วนต่าง OT หลังปิดรอบ (A4 แนวตั้ง)

// ---------- จัดเวรตามกรอบอัตรากำลัง (เช้า / บ่าย / ดึก) ----------
// กรอบ = ตัวเลขชุดเดียวกับแถว "สรุปอัตรากำลัง/วัน" (กะยาวนับเศษ เช่น ช21 = ช 1 + บ .75)
// นับเวรที่มีอยู่แล้วในวันนั้นก่อน แล้วเลือกกะจากที่หัวหน้าเลือก ให้เติมส่วนที่ขาดได้มากที่สุดโดยไม่เกินกรอบ (ดึก > บ่าย > เช้า)
const CATS = ['ช', 'บ', 'ด'], CAT_NAME = { 'ช': 'เช้า', 'บ': 'บ่าย', 'ด': 'ดึก' }, CAT_W = { 'ช': 1, 'บ': 2, 'ด': 3 };
const catOf = s => SHIFT_CATEGORY_MAP[s] || {};
const covOf = list => { const c = { 'ช': 0, 'บ': 0, 'ด': 0 }; list.forEach(s => { if (SHIFT_TYPES[s]) Object.entries(catOf(s)).forEach(([k, v]) => { if (k in c) c[k] += v; }); }); return c; };
const r3 = n => Math.round(n * 1000) / 1000;
const bestShift = (need, shifts, skip = [], used = {}) => {   // กะที่เติมได้มากสุด ถ้าเท่ากันใช้กะที่ถูกใช้น้อยกว่า (หมุนเวียน ช / ช6)
  let best = null, bg = 0;
  shifts.filter(s => !skip.includes(s)).forEach(s => {
    const w = catOf(s); let gain = 0, over = false;
    Object.entries(w).forEach(([c, v]) => { const n = Math.max(need[c] || 0, 0); if (v > n + 1e-6) over = true; gain += Math.min(v, n) * (CAT_W[c] || 0); });
    if (!over && gain > 1e-9 && (gain > bg + 1e-9 || (Math.abs(gain - bg) <= 1e-9 && (used[s] || 0) < (used[best] || 0)))) { bg = gain; best = s; }
  });
  return best;
};
// ตัวอย่างชุดกะ 1 วัน (ไม่นับข้อจำกัดคน) ใช้แสดงในหน้าตั้งกรอบ
const sampleCombo = (fr, shifts) => {
  const need = { ...fr }, picks = []; let s;
  while (picks.length < 60 && (s = bestShift(need, shifts))) { picks.push(s); Object.entries(catOf(s)).forEach(([c, v]) => { need[c] = r3((need[c] || 0) - v); }); }
  return { picks, left: need };
};
function planCat({ dates, emps, allEmps, schedules, frame, shifts, maxRun, restNight, temp = {} }) {   // temp = รายวัน / Parttime (ใช้เติมหลังพนักงานประจำ)
  const cur = {}, credit = {}, cnt = {}, updates = [], short = [], days = [], used = {};
  const prevOf = d => fmtInput(new Date(new Date(d + 'T00:00:00').getTime() - 864e5));
  const ids = [...new Set([...allEmps, ...emps])];

      const c = await Swal.fire({ icon: 'info', title: 'ส่งออกเป็น PDF', html: 'หน้าต่างพิมพ์จะเปิดขึ้น<br>ที่ <b>ปลายทาง / เครื่องพิมพ์</b> เลือก <b>"บันทึกเป็น PDF"</b><br>ตั้งกระดาษ A4 แนวนอน และเปิดกราฟิกพื้นหลัง', showCancelButton: true, confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก', confirmButtonColor: themeHex('p'), reverseButtons: true });
      if (!c.isConfirmed) return;
      try { localStorage.setItem('rt_pdf_tip', '1'); } catch (e) {}
    }
    const old = document.title;
    document.title = `${adminTab === 'summary' ? 'สรุปOT' : 'ตารางเวร'}_${filterDept}_${ymTh(matrixMonth).replace(' ', '')}`;
    const back = () => { document.title = old; window.removeEventListener('afterprint', back); };
    window.addEventListener('afterprint', back);
    setTimeout(() => { window.print(); setTimeout(back, 60000); }, 300);
  };

  // ---------- ส่งตารางเวร / ปลดล็อก ----------
  const pub = pubInfo(settings, filterDept, matrixMonth), locked = pub.st === 'published';
  const canPub = role === 'admin' || (role === 'supervisor' && filterDept === user.dept);
  const publish = async () => {
    const ids = Object.keys(employees).filter(id => employees[id].dept === filterDept);
    const empty = ids.reduce((a, id) => a + daysArray.filter(d => !(schedules[dayStr(d)]?.[id]?.shifts || []).length).length, 0);
    const c = await Swal.fire({ icon: 'question', title: `ส่งตารางเวร ${ymTh(matrixMonth)}?`,
      html: `<p style="font-size:.95em">แผนก${filterDept} · พนักงาน ${ids.length} คน</p>${empty ? `<p style="color:#b45309;font-weight:700;margin-top:6px">ยังมีช่องว่าง ${empty} ช่อง</p>` : ''}<p style="font-size:.9em;margin-top:8px">ส่งแล้วพนักงานจะเห็นตารางเวรทันที และแก้ตรงในตารางไม่ได้ ต้องเพิ่ม / แก้เวรผ่านคำขอเปลี่ยนเวร</p>`,
      showCancelButton: true, confirmButtonText: 'ส่งยืนยันตารางเวร', cancelButtonText: 'ยังไม่ส่ง', confirmButtonColor: themeHex('p'), reverseButtons: true });
    if (!c.isConfirmed) return;
    const r = await sendToGoogleSheet('publishSchedule', { dept: filterDept, month: matrixMonth, editorId: user.id });
    if (r?.status === 'success') { await reload(); info('ส่งตารางเวรแล้ว'); }
  };
  const unlock = async () => {
    const c = await Swal.fire({ icon: 'warning', title: `ปลดล็อกตาราง ${ymTh(matrixMonth)}?`, text: `แผนก${filterDept} จะกลับเป็นฉบับร่าง หัวหน้าแก้ได้แล้วต้องกดส่งใหม่`, input: 'text', inputPlaceholder: 'เหตุผลที่ปลดล็อก',
      inputValidator: v => !v?.trim() && 'กรุณาระบุเหตุผล', showCancelButton: true, confirmButtonText: 'ปลดล็อก', cancelButtonText: 'ยกเลิก', confirmButtonColor: themeHex('s'), reverseButtons: true });
    if (!c.isConfirmed) return;
    const r = await sendToGoogleSheet('unlockSchedule', { dept: filterDept, month: matrixMonth, editorId: user.id, reason: c.value.trim() });
    if (r?.status === 'success') { await reload(); info('ปลดล็อกแล้ว'); }
  };
  const openCell = (empId, ds, o) => locked ? setAdjCell({ empId, ds }) : setCellData({ empId, dateStr: ds, shifts: [...(o?.shifts || [])] });

  const saveCell = async () => {
    const { empId, dateStr, shifts } = cellData, f = shifts.filter(s => s !== ''), sch = { ...schedules }, expect = cellNow(dateStr, empId);
    withEdit(sch, dateStr, empId, f); setSchedules(sch); setCellData(null);
    await saveSched('saveSchedule', { date: dateStr, empId, shifts: f, expect, ...editor });
  };

  // ---------- Export ----------
  const head = (title, cols) => [[title, ...cols], ''];
  const recRow = r => { const e = employees[r.empId] || {}; return [formatDisplayDate(r.date), r.empId, `${e.fname} ${e.lname}`, e.dept, SHIFT_TYPES[r.shiftId]?.label || '', r.timeIn, r.timeOut || '-']; };
  const range = [`แผนก: ${filterDept || 'ทั้งหมด'}`, `ตั้งแต่วันที่: ${startDate || '-'}`, `ถึงวันที่: ${endDate || '-'}`];

    const t = {};
    daysArray.forEach(d => Object.entries(getDaily(d)).forEach(([s, c]) => { (t[s] = t[s] || {})[d] = c; }));

  };
  const exportLogs = () => filteredRecords.length ? downloadCSV([...head('ประวัติลงเวลาทั้งหมด', range), 'วันที่,รหัสพนักงาน,ชื่อ-สกุล,แผนก,กะ,เวลาเข้า,เวลาออก,สถานะ,สาย (นาที),จำนวนเวร',
    ...filteredRecords.map(r => [...recRow(r), r.isLate ? 'สาย' : 'ปกติ', r.isLate ? r.lateMinutes : '0', r.credit])], `ประวัติลงเวลา_${Date.now()}.csv`) : nodata();
  const exportEx = () => {
    if (!exceptionRecords.length) return nodata();
    const title = exFilter === 'late' ? 'รายงานพนักงานผู้มาสาย' : 'รายงานพนักงานลืมลงเวลาออก';
    downloadCSV([...head(title, range), 'วันที่,รหัสพนักงาน,ชื่อ-สกุล,แผนก,กะ,เวลาเข้า,เวลาออก,สาย (นาที)', ...exceptionRecords.map(r => [...recRow(r), r.isLate ? r.lateMinutes : '0'])], `${title}_${Date.now()}.csv`);
  };
  const exportSummary = () => {
    if (!summaryMatrix.length) return Swal.fire("แจ้งเตือน", "ไม่มีข้อมูลสรุปสำหรับส่งออก", "info");
    const hdr = ['รหัสพนักงาน', 'ชื่อ-สกุล', 'แผนก', ...daysArray, ...types, 'รวมเวรทั้งหมด', 'วันทำการ', 'เวร OT', ...(role === 'admin' ? ['รวมสาย (นาที)'] : [])].join(',');
    const body = summaryMatrix.map(r => [r.empId, `${r.fname} ${r.lname}`, r.dept, ...daysArray.map(d => r.shiftsByDay[d].ui.map(e => e.shift).join(',') || '-'), ...types.map(t => r.shiftCounts[t] || 0), r.credit, r.temp ? '-' : localWorkDays, r.temp ? '-' : r.ot, ...(role === 'admin' ? [r.late] : [])]);
    const sum = k => summaryMatrix.reduce((a, r) => a + r[k], 0);
    downloadCSV([[`สรุปภาพรวมแผนก: ${filterDept || 'ทุกแผนก'}`, `ประจำเดือน: ${matrixMonth}`], '', hdr, ...body, '',
      ['รวมยอดทั้งแผนก', ...Array(3 + daysArray.length + types.length - 1).fill(''), sum('credit'), '', sum('ot')], '', ...dailyRows()], `สรุปภาพรวมแผนก_${matrixMonth}.csv`);
  };
  const exportSchedule = () => {
    if (!matrixEmployees.length) return Swal.fire("แจ้งเตือน", "ไม่มีข้อมูลพนักงานสำหรับส่งออก", "info");

      ...matrixEmployees.map(id => { const e = employees[id]; return [id, `${e.fname} ${e.lname}`, e.dept, ...daysArray.map(d => (schedules[dayStr(d)]?.[id]?.shifts || []).join(', ') || '-')]; }), '', ...dailyRows()], `ตารางเวร_${matrixMonth}.csv`);
  };

  const TAB_ICON = { logs: 'fa-clock-rotate-left', summary: 'fa-bolt', schedules: 'fa-calendar-days', exceptions: 'fa-triangle-exclamation', swaps: 'fa-right-left' };

      {k === 'swaps' && pendingSw > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-[20px] h-5 px-1 rounded-full bg-secondary text-white text-xs font-bold flex items-center justify-center">{pendingSw}</span>}</span>
